name: Deploy to GitHub Pages

# The whole app is static files at the repository root, so there is nothing to
# build — the deploy just publishes the checkout as-is.
#
# configure-pages runs with enablement: true, so the first successful run turns
# Pages on by itself and no repository setting has to be clicked. Pages on a
# private repository needs a paid plan; on the free plan the repository has to
# be public for this to succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
