<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Timezones</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e9e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timezones">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* ---------------------------------------------------------------- theme */
:root {
  --page: #e9e9e6;
  --page-fg: #1a1a18;
  --page-muted: #86867f;
  --page-line: rgba(0,0,0,.12);
  --accent: #f5c400;
  --font: "Inter", "Inter var", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 4px;
  /* Card surface. Follows the page theme, never the city's local darkness —
     only the dial itself fades, so card text keeps full contrast. */
  --face: #fff;
  --fg: #131311;
  --muted: #8d8d86;
  --edge: rgba(0,0,0,.10);
  /* The dial's own rim. Separate from --edge because in card shading the card
     goes dark while the dial stays a pale moon, and one value cannot serve both. */
  --dial-edge: rgba(0,0,0,.10);
  --sun: #e5a52c;
  --moon: #9d9d94;
}
html.dark {
  --page: #0b0b0b;
  --page-fg: #f0f0ee;
  --page-muted: #6f6f6a;
  --page-line: rgba(255,255,255,.14);
  --face: #151515;
  --fg: #f0f0ee;
  --muted: #78786f;
  --edge: rgba(255,255,255,.14);
  --dial-edge: rgba(255,255,255,.14);
  --sun: #c98f21;
  --moon: #d3d3ca;
}

/* No cross-fades on the very first paint, so a night board doesn't flash light. */
html.booting *, html.booting *::before, html.booting *::after { transition: none !important; }

body {
  background: var(--page);
  color: var(--page-fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1;
  transition: background-color .5s ease, color .5s ease;
  min-height: 100vh;
  /* Bottom room so the last row of cards can scroll clear of the dock. */
  padding: 24px max(16px, 3vw) 96px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ------------------------------------------------- floating dock + menu */
/* The board is the whole page, so the controls sit out of the way in the
   bottom-right rather than in a header bar of their own. */
.dock {
  position: fixed; right: 18px; bottom: 18px; z-index: 26;
  display: flex; gap: 8px;
}
.fab {
  width: 40px; height: 40px; border-radius: 50%; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge);
  box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 10px 28px -18px rgba(0,0,0,.6);
  transition: border-color .15s ease, transform .12s ease;
}
.fab:hover { border-color: currentColor; }
.fab:active { transform: translateY(1px); }
/* The icon is transparent to the pointer, so every event inside the button is
   targeted at the button itself. Otherwise a press lands on a <path> whose
   geometry is a 1.7px stroke with gaps around it, and the button's own 40px
   circle is only reliably hit outside the icon. */
.fab svg { width: 18px; height: 18px; pointer-events: none; }
.fab .ico-close, .dock.open .ico-menu { display: none; }
.dock.open .ico-close { display: block; }

.popover {
  position: fixed; right: 18px; bottom: 68px; z-index: 26; width: 272px;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 12px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.55);
  padding: 9px 14px 15px;
  max-height: calc(100vh - 100px); overflow-y: auto;
}
.popover[hidden] { display: none; }
.popover section { padding-top: 13px; }
.popover h2 {
  margin: 0 0 7px; font-size: 9px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.hint { margin: 7px 0 0; font-size: 10.5px; line-height: 1.5; color: var(--muted); }
.popover section.muted { opacity: .45; }
/* The dial is a set of targets: click an hour mark to go there, the centre to
   come back to now. touch-action stays permissive so a tap on a dial does not
   cost the page its scroll. */
.clock { cursor: pointer; touch-action: manipulation; }

/* Segmented control: every mode visible at once, rather than a button you
   have to click repeatedly to discover what it cycles through. */
.seg {
  display: flex; border: 1px solid var(--edge);
  border-radius: var(--r); overflow: hidden;
}
.seg button {
  flex: 1; font: inherit; font-size: 10.5px; letter-spacing: .07em;
  text-transform: uppercase; white-space: nowrap;
  padding: 7px 4px; background: transparent; color: var(--fg);
  border: 0; cursor: pointer; transition: background-color .12s ease;
}
.seg button + button { border-left: 1px solid var(--edge); }
.seg button:hover[aria-checked="false"] { background: rgba(127,127,127,.14); }
.seg button[aria-checked="true"] { background: var(--accent); color: #14140f; }

.btn {
  font: inherit; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--page-fg); background: transparent;
  border: 1px solid var(--page-line); border-radius: var(--r);
  padding: 6px 10px; cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover { border-color: currentColor; }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #111; }
.btn:focus-visible, .card__name:focus-visible, .card__remove:focus-visible,
.add:focus-visible, .row:focus-visible, .fab:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.seg button:focus-visible { outline-offset: -2px; }
#search:focus { outline: none; border-bottom-color: var(--accent); box-shadow: 0 1px 0 var(--accent); }

/* ---------------------------------------------------------------- grid */
.grid {
  max-width: 1160px; margin: 0 auto;
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
}

/* ---------------------------------------------------------------- card */
/* Whichever surface is shading, its colours are rewritten inline every second,
   interpolated from a 0-1 darkness value. In card shading the card's own
   --face/--fg/--muted/--edge are overwritten and the dial stays pale; in dial
   shading only --dial and --dial-fg move and the card keeps the page theme. */
.card {
  --dial: #fff;
  --dial-fg: #131311;
  position: relative;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 10px;
  padding: 16px 16px 0;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 8px 24px -18px rgba(0,0,0,.5);
  /* The surface cross-fades, the ink does not: mid-fade between a light and a
     dark ink is grey on grey, which is the one state this must never pass
     through. It steps at the halfway colour instead, where both read about
     4.5:1 either way. */
  transition: background-color .35s ease, border-color .35s ease;
}
.card.dragging { opacity: .35; }
/* A caret in the gutter shows where the card will land, rather than
   highlighting a card and leaving before-or-after ambiguous. */
.card.drop-before::before, .card.drop-after::after {
  content: ""; position: absolute; top: 2px; bottom: 2px; width: 3px;
  background: var(--accent); border-radius: 3px;
}
.card.drop-before::before { left: -11px; }
.card.drop-after::after { right: -11px; }

.card__name {
  font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  padding: 2px 6px; border-radius: var(--r); text-align: center; width: 100%;
  display: block;
}
.card__name b {
  display: block; font-size: 15px; font-weight: 600; letter-spacing: .01em;
  border-bottom: 1px solid transparent; padding-bottom: 1px; display: inline-block;
}
.card__name:hover b { border-bottom-color: currentColor; }
.card__name span {
  display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-top: 4px;
}

.card__remove {
  position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
  font: 15px/1 var(--font); cursor: pointer; opacity: 0;
  transition: opacity .15s ease, color .15s ease;
}
.card:hover .card__remove, .card__remove:focus-visible { opacity: 1; }
.card__remove:hover { color: var(--fg); }

.clock { display: block; width: 100%; max-width: 218px; margin: 8px 0 0; }
.clock text { font-family: var(--font); }

/* The sky dome closes the card. It and the sunrise/sunset labels share a width
   so the labels sit directly under the ends of the arc. */
.skyband { width: 100%; max-width: 210px; margin: 4px 0 10px; }
.dome { display: block; width: 100%; overflow: visible; }

.digital { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.digital time {
  font-size: 26px; font-weight: 300; letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  cursor: pointer; border-bottom: 1px dashed transparent; padding-bottom: 1px;
}
.digital time:hover { border-bottom-color: var(--muted); }

/* Typing a time in any card converts it across every other card. */
.tedit {
  font: inherit; font-size: 26px; font-weight: 300; letter-spacing: .01em;
  font-variant-numeric: tabular-nums; text-align: center;
  width: 6.4ch; padding: 0 0 1px; margin: 0;
  background: transparent; color: var(--fg);
  border: 0; border-bottom: 2px solid var(--accent); border-radius: 0;
}
.tedit:focus { outline: none; }
.tedit.bad { border-bottom-color: #cf3b2f; }
.card.editing { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A stopped second hand reads as stopped, but dim it so it is unmistakable. */
html.frozen .hand-sec { opacity: .3; }

/* A read-out with nothing to click, sitting above the dock in the stack and wide
   enough to reach it on a narrow screen, so it stays out of the way of the
   pointer entirely. */
.note {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  pointer-events: none;
  z-index: 27; display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 7px; max-width: calc(100vw - 32px);
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 100px;
  padding: 8px 15px; font-size: 11px; letter-spacing: .05em;
  box-shadow: 0 3px 10px rgba(0,0,0,.14), 0 16px 40px -22px rgba(0,0,0,.6);
}
.note[hidden] { display: none; }
.note kbd {
  font: inherit; font-size: 10px; letter-spacing: .06em;
  border: 1px solid var(--edge); border-radius: 3px; padding: 1px 5px;
  background: rgba(127,127,127,.12);
}
.note kbd + kbd { margin-left: -4px; }
.note #noteLabel { font-variant-numeric: tabular-nums; min-width: 8.5ch; }
.note-sep { opacity: .4; }
.digital time small { font-size: 12px; font-weight: 400; letter-spacing: .06em; margin-left: 2px; }
.digital .rel {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}

.sun {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; margin-top: 1px;
  font-size: 11px; letter-spacing: .06em; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.sun .sun-polar, .sun .wx-now { margin: 0 auto; }
.sun .wx-now { display: inline-flex; align-items: center; gap: 4px; }
.sun .wx-now:empty { display: none; }
.sun > span { display: inline-flex; align-items: center; gap: 4px; }
.sun svg { width: 14px; height: 14px; flex: none; opacity: .9; }

/* Only the nearer of the two working-day boundaries, quietly, at the foot. */
.next {
  width: 100%; padding: 9px 4px 12px; text-align: center;
  border-top: 1px solid var(--edge);
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.next b { font-weight: 500; color: var(--fg); opacity: .75; text-transform: none; }

/* --------------------------------------------------------- compact mode */
/* Four across on a phone. The time itself says which zone you are looking at,
   so the GMT line goes; the sky dome and the forecast ring go too, and the
   forecast becomes three hours in a strip. What is left is a tile you can scan.
   At this size the numerals and minute ticks are noise, so they are dropped
   and the dial keeps only its hour bars. */
.mini-wx { display: none; justify-content: center; gap: 3px; margin-top: 3px; }
.mini-wx svg { width: 15px; height: 15px; opacity: .55; }

/* Bounded tiles, centred, on anything roomy. A definite max is deliberate here:
   auto-fill counts repetitions using the max track size, so 132px keeps the
   tiles from stretching into slabs when only a few cities are on the board. */
html[data-density="compact"] .grid {
  grid-template-columns: repeat(auto-fill, minmax(78px, 132px));
  gap: 8px; justify-content: center;
}
/* On a phone that same rule counts 366/140 = 2 tracks, which is the opposite of
   what is wanted. Switching the max to 1fr makes the count use the 78px minimum
   instead, giving four across at typical phone widths and dropping to three
   rather than overflowing on a 320px screen. */
@media (max-width: 560px) {
  html[data-density="compact"] .grid {
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
  }
}
html[data-density="compact"] .card { padding: 7px 5px 0; border-radius: 8px; }
html[data-density="compact"] .card__name { padding: 0; }
html[data-density="compact"] .card__name b {
  font-size: 11px; display: block; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
html[data-density="compact"] .card__name span,
html[data-density="compact"] .skyband,
html[data-density="compact"] .clock text,
html[data-density="compact"] .clock .tick-min { display: none; }
html[data-density="compact"] .card__remove { top: 2px; right: 2px; width: 16px; height: 16px; font-size: 12px; }
html[data-density="compact"] .clock { max-width: 100%; margin: 3px 0 0; }
/* The preview tag is wider than a compact tile's dial, and its text is dropped
   with every other label at this size, so the whole tag goes. */
html[data-density="compact"] .ghost-tag { display: none; }
html[data-density="compact"] .digital { margin-top: 1px; gap: 3px; }
html[data-density="compact"] .digital time { font-size: 15px; }
html[data-density="compact"] .digital time small { font-size: 8px; margin-left: 1px; }
html[data-density="compact"] .digital .rel { font-size: 8px; letter-spacing: .06em; }
html[data-density="compact"] .tedit { font-size: 15px; width: 5.2ch; border-bottom-width: 1px; }
html[data-density="compact"] .mini-wx { display: flex; }
html[data-density="compact"] .next {
  font-size: 9px; letter-spacing: .03em; padding: 5px 2px 7px; margin-top: 5px;
}
html[data-density="compact"] .next svg {
  width: 10px; height: 10px; vertical-align: -2px; margin-right: 2px;
}
html[data-density="compact"] .add { min-height: 74px; font-size: 9px; letter-spacing: .06em; }
html[data-density="compact"] .add svg { width: 14px; height: 14px; }

/* ------------------------------------------------------------- add tile */
.add {
  border: 1px dashed var(--page-line); border-radius: 10px; background: transparent;
  color: var(--page-muted); font: inherit; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; cursor: pointer; min-height: 148px; align-self: start;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  transition: color .15s ease, border-color .15s ease;
}
.add:hover { color: var(--page-fg); border-color: currentColor; }
.add svg { width: 22px; height: 22px; pointer-events: none; }

/* -------------------------------------------------------------- picker */
.sheet {
  position: fixed; inset: 0; z-index: 20; display: none;
  align-items: flex-start; justify-content: center;
  padding: max(8vh, 40px) 16px 16px;
  background: rgba(20,20,18,.42); backdrop-filter: blur(3px);
}
.sheet.open { display: flex; }
.panel {
  width: 100%; max-width: 460px; max-height: 76vh;
  background: var(--page); color: var(--page-fg);
  border: 1px solid var(--page-line); border-radius: 10px;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,.6);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel header {
  padding: 14px 16px 12px; border-bottom: 1px solid var(--page-line);
}
.panel header p {
  margin: 0 0 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--page-muted);
}
#search {
  width: 100%; font: inherit; font-size: 16px; color: inherit;
  background: transparent; border: 0; border-bottom: 1px solid var(--page-line);
  padding: 4px 0 8px; border-radius: 0;
}
#search::placeholder { color: var(--page-muted); }
.list { overflow-y: auto; padding: 6px; }
.row {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  font: inherit; text-align: left; color: inherit;
  background: transparent; border: 0; border-radius: var(--r);
  padding: 9px 10px; cursor: pointer;
}
.row[aria-selected="true"] { background: rgba(127,127,127,.16); }
.row b { font-weight: 500; font-size: 14px; }
.row span { font-size: 11px; color: var(--page-muted); letter-spacing: .04em; }
.row time {
  margin-left: auto; font-size: 12px; color: var(--page-muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.list .empty { padding: 18px 10px; font-size: 13px; color: var(--page-muted); }
.panel footer {
  border-top: 1px solid var(--page-line); padding: 10px 12px;
  display: flex; gap: 8px; justify-content: space-between;
}

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
  background: var(--page-fg); color: var(--page);
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 9px 14px; border-radius: 100px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; z-index: 30;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Phones get one column — auto-fill already does that, so only trim the chrome.
   Forcing two columns here overflows: the working-hours labels don't wrap. */
@media (max-width: 420px) {
  .grid { gap: 12px; }
  .card { padding: 14px 12px 10px; }
  .digital time { font-size: 24px; }
}
</style>
</head>
<body>

<h1 class="sr-only">Timezones</h1>

<main class="grid" id="grid"></main>

<div class="dock" id="dock">
  <button class="fab" id="share" title="Copy a link to this board" aria-label="Copy a link to this board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M9 17H7.5a5 5 0 0 1 0-10H9"/><path d="M15 7h1.5a5 5 0 0 1 0 10H15"/><path d="M8.5 12h7"/>
    </svg>
  </button>
  <button class="fab" id="menu" title="Settings" aria-label="Settings"
    aria-expanded="false" aria-controls="settings">
    <svg class="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
    </svg>
    <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
    </svg>
  </button>
</div>

<div class="popover" id="settings" hidden>
  <section>
    <h2>Density</h2>
    <div class="seg" role="radiogroup" aria-label="Density" data-group="density">
      <button type="button" role="radio" data-val="auto">Auto</button>
      <button type="button" role="radio" data-val="full">Full</button>
      <button type="button" role="radio" data-val="compact">Compact</button>
    </div>
    <p class="hint" id="hint-density"></p>
  </section>
  <section>
    <h2>Time format</h2>
    <div class="seg" role="radiogroup" aria-label="Time format" data-group="hour12">
      <button type="button" role="radio" data-val="0">24-hour</button>
      <button type="button" role="radio" data-val="1">12-hour</button>
    </div>
  </section>
  <section>
    <h2>Night darkens</h2>
    <div class="seg" role="radiogroup" aria-label="What darkens at night" data-group="shade">
      <button type="button" role="radio" data-val="card">The card</button>
      <button type="button" role="radio" data-val="dial">The dial</button>
    </div>
    <p class="hint" id="hint-shade"></p>
  </section>
  <section>
    <h2>Night follows</h2>
    <div class="seg" role="radiogroup" aria-label="What counts as night" data-group="solar">
      <button type="button" role="radio" data-val="0">Working hours</button>
      <button type="button" role="radio" data-val="1">Real sun</button>
    </div>
    <p class="hint" id="hint-solar"></p>
  </section>
  <section>
    <h2>Weather forecast</h2>
    <div class="seg" role="radiogroup" aria-label="Weather forecast" data-group="weather">
      <button type="button" role="radio" data-val="dial">Dial</button>
      <button type="button" role="radio" data-val="dome">Dome</button>
      <button type="button" role="radio" data-val="off">Off</button>
    </div>
    <p class="hint" id="hint-weather"></p>
  </section>
  <section id="sec-ring">
    <h2>Dial ring</h2>
    <div class="seg" role="radiogroup" aria-label="Dial ring" data-group="ring">
      <button type="button" role="radio" data-val="icons">Icons</button>
      <button type="button" role="radio" data-val="temps">Temps</button>
      <button type="button" role="radio" data-val="both">Both</button>
    </div>
    <p class="hint" id="hint-ring"></p>
  </section>
  <section>

const slug = s => s.toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CITIES = CITY_DATA.map(([name, country, tz, lat, lon, alias, region, id]) => ({
  name, country, tz, lat, lon,
  region: region || "",
  // Shown on the card: the state or province where that is the more useful
  // label (Santa Cruz -> California), the country otherwise.
  place: region || country,
  id: id || slug(name),
  hay: (name + " " + country + " " + (region || "") + " " +
        tz.replace(/[_/]/g, " ") + " " + alias).toLowerCase()
}));

// Same-name cities in different countries would otherwise collide and one would
// silently disappear from the lookup, so disambiguate rather than overwrite.
const BY_ID = new Map();
for (const c of CITIES) {
  if (BY_ID.has(c.id)) c.id = slug(c.name + "-" + (c.region || c.country));
  while (BY_ID.has(c.id)) c.id += "-2";
  BY_ID.set(c.id, c);
}

/* =======================================================================
   Time-zone helpers
   ======================================================================= */
const partFmts = new Map();
function partsFor(tz, date) {
  let f = partFmts.get(tz);
  if (!f) {
    f = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    partFmts.set(tz, f);
  }
  const o = {};
  for (const p of f.formatToParts(date)) if (p.type !== "literal") o[p.type] = +p.value;
  // Wall-clock time in the zone, plus the zone's offset from UTC in minutes.
  const asUTC = Date.UTC(o.year, o.month - 1, o.day, o.hour, o.minute, o.second);
  const offset = Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
  return {
    y: o.year, mo: o.month, d: o.day, h: o.hour, mi: o.minute, s: o.second,
    offset, minutes: o.hour * 60 + o.minute + o.second / 60,
    midnightUTC: Date.UTC(o.year, o.month - 1, o.day) - offset * 60000
  };
}

function offsetLabel(min) {
  const sign = min < 0 ? "−" : "+";
  const a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
  return "GMT" + (a === 0 ? "" : sign + h + (m ? ":" + String(m).padStart(2, "0") : ""));
}

// English, like every other label here, rather than the browser's locale: a card
// reading "mercredi" beside "TILL MORNING 08:00" would be worse than either.
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday",
                   "Friday", "Saturday"];

function clockText(h, mi, hour12) {
  if (!hour12) return { t: String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0"), suffix: "" };
  const ap = h < 12 ? "am" : "pm";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return { t: hh + ":" + String(mi).padStart(2, "0"), suffix: ap };
}

// A minutes-past-midnight value as a wall-clock label: "18:00" or "6 pm".
function stamp(min, hour12) {
  const v = ((min % 1440) + 1440) % 1440;
  const t = clockText(Math.floor(v / 60), Math.floor(v % 60), hour12);
  if (!hour12) return t.t;
  return (v % 60 === 0 ? t.t.slice(0, -3) : t.t) + " " + t.suffix;
}

function fmtDur(min) {
  const total = Math.max(0, Math.round(min));
  const h = Math.floor(total / 60), m = total % 60;
  if (h === 0) return m + "m";
  return h + "h " + String(m).padStart(2, "0") + "m";
}

/* =======================================================================
   Sunrise / sunset — NOAA "sunrise equation"
   ======================================================================= */
const RAD = Math.PI / 180;
const toJulian = ms => ms / 86400000 + 2440587.5;
const fromJulian = j => (j - 2440587.5) * 86400000;

function sunTimes(lat, lon, localNoonUTCms) {
  const lw = -lon;
  const n = Math.round(toJulian(localNoonUTCms) - 2451545 - 0.0009 - lw / 360);
  const Js = 2451545 + 0.0009 + lw / 360 + n;                      // mean solar noon
  const M = (357.5291 + 0.98560028 * (Js - 2451545)) % 360;        // solar mean anomaly
  const C = 1.9148 * Math.sin(M * RAD) + 0.02 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
  const L = (M + C + 180 + 102.9372) % 360;                        // ecliptic longitude
  const Jtransit = Js + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * L * RAD);
  const sinDec = Math.sin(L * RAD) * Math.sin(23.4397 * RAD);
  const cosDec = Math.cos(Math.asin(sinDec));
  // transit and declination are kept for the altitude calculation below.
  const out = { transit: fromJulian(Jtransit), sinDec, cosDec };
  const cosW = (Math.sin(-0.833 * RAD) - Math.sin(lat * RAD) * sinDec) / (Math.cos(lat * RAD) * cosDec);
  if (cosW > 1) { out.polar = "night"; return out; }                // sun never rises
  if (cosW < -1) { out.polar = "day"; return out; }                 // sun never sets
  const w = Math.acos(cosW) / RAD;
  out.sunrise = fromJulian(Jtransit - w / 360);
  out.sunset = fromJulian(Jtransit + w / 360);
  return out;
}

// Height of the sun above the horizon, in degrees. Works everywhere, including
// latitudes where the sun never rises or sets.
function altitudeAt(lat, sun, nowMs) {
  const H = 360 * (nowMs - sun.transit) / 86400000;   // hour angle from solar noon
  const s = Math.sin(lat * RAD) * sun.sinDec +
            Math.cos(lat * RAD) * sun.cosDec * Math.cos(H * RAD);
  return Math.asin(Math.max(-1, Math.min(1, s))) / RAD;
}

const sunCache = new Map();

// dayOffset of -1 / +1 gives the neighbouring local day, which is what the
// night span needs: yesterday's sunset, or tomorrow's sunrise.
function sunForOffset(city, parts, dayOffset) {
  const noon = parts.midnightUTC + dayOffset * 86400000 + 12 * 3600000;
  const key = city.id + "|" + noon;
  let v = sunCache.get(key);
  if (!v) {
    v = sunTimes(city.lat, city.lon, noon);
    if (sunCache.size > 400) sunCache.clear();
    sunCache.set(key, v);
  }
  return v;
}
const sunFor = (city, parts) => sunForOffset(city, parts, 0);

/* =======================================================================
   Where the sun and the moon actually are

   The dome needs more than sunrise and sunset: both bodies are on it all the
   time now, one above the horizon and one below, so each has to be placed from
   its own position in the sky rather than from a span of clock time. That means
   right ascension, declination and an hour angle for each.

   Low-precision series, the usual ones: the sun is good to about a minute of
   arc and the moon to about 0.3 degrees, which at this size is a fraction of a
   pixel. Both depend only on the instant, so they are computed once per frame
   and shared by every card; only the hour angle is per city.
   ======================================================================= */
const J2000 = 946728000000;                      // 2000-01-01T12:00Z, in ms
const daysSince2000 = ms => (ms - J2000) / 86400000;
const OBLIQ = 23.4397 * RAD;                     // tilt of the earth's axis

// Ecliptic (longitude, latitude) to equatorial (right ascension, declination).
function eclToEq(lon, lat) {
  return {
    ra: Math.atan2(Math.sin(lon) * Math.cos(OBLIQ) - Math.tan(lat) * Math.sin(OBLIQ),
                   Math.cos(lon)),
    dec: Math.asin(Math.sin(lat) * Math.cos(OBLIQ) +
                   Math.cos(lat) * Math.sin(OBLIQ) * Math.sin(lon))
  };
}

function sunEq(d) {
  const M = (357.5291 + 0.98560028 * d) * RAD;                     // mean anomaly
  const C = (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) +
             0.0003 * Math.sin(3 * M)) * RAD;                      // equation of centre
  const L = M + C + (102.9372 + 180) * RAD;                        // ecliptic longitude
  return eclToEq(L, 0);
}

function moonEq(d) {
  const L = (218.316 + 13.176396 * d) * RAD;   // mean longitude
  const M = (134.963 + 13.064993 * d) * RAD;   // mean anomaly
  const F = (93.272 + 13.229350 * d) * RAD;    // argument of latitude
  const eq = eclToEq(L + 6.289 * RAD * Math.sin(M), 5.128 * RAD * Math.sin(F));
  eq.dist = 385001 - 20905 * Math.cos(M);      // km, for the phase geometry
  return eq;
}

// Greenwich sidereal time, less the observer's west longitude: the angle the
// sky has turned through where they are standing.
const siderealTime = (d, lonDeg) => (280.16 + 360.9856235 * d) * RAD + lonDeg * RAD;

/* How much of the moon's disc is lit, and which limb it is lit from. Global,
