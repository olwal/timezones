<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Timezones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* ---------------------------------------------------------------- theme */
:root {
  --page: #e9e9e6;
  --page-fg: #1a1a18;
  --page-muted: #86867f;
  --page-line: rgba(0,0,0,.12);
  --accent: #f5c400;
  --font: "Inter", "Inter var", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 4px;
  /* Card surface. Follows the page theme, never the city's local darkness —
     only the dial itself fades, so card text keeps full contrast. */
  --face: #fff;
  --fg: #131311;
  --muted: #8d8d86;
  --edge: rgba(0,0,0,.10);
  --sun: #e5a52c;
  --moon: #9d9d94;
}
html.dark {
  --page: #0b0b0b;
  --page-fg: #f0f0ee;
  --page-muted: #6f6f6a;
  --page-line: rgba(255,255,255,.14);
  --face: #151515;
  --fg: #f0f0ee;
  --muted: #78786f;
  --edge: rgba(255,255,255,.14);
  --sun: #c98f21;
  --moon: #d3d3ca;
}

/* No cross-fades on the very first paint, so a night board doesn't flash light. */
html.booting *, html.booting *::before, html.booting *::after { transition: none !important; }

body {
  background: var(--page);
  color: var(--page-fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1;
  transition: background-color .5s ease, color .5s ease;
  min-height: 100vh;
  /* Bottom room so the last row of cards can scroll clear of the dock. */
  padding: 24px max(16px, 3vw) 96px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ------------------------------------------------- floating dock + menu */
/* The board is the whole page, so the controls sit out of the way in the
   bottom-right rather than in a header bar of their own. */
.dock {
  position: fixed; right: 18px; bottom: 18px; z-index: 26;
  display: flex; gap: 8px;
}
.fab {
  width: 40px; height: 40px; border-radius: 50%; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge);
  box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 10px 28px -18px rgba(0,0,0,.6);
  transition: border-color .15s ease, transform .12s ease;
}
.fab:hover { border-color: currentColor; }
.fab:active { transform: translateY(1px); }
.fab svg { width: 18px; height: 18px; }
.fab .ico-close, .dock.open .ico-menu { display: none; }
.dock.open .ico-close { display: block; }

.popover {
  position: fixed; right: 18px; bottom: 68px; z-index: 26; width: 272px;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 12px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.55);
  padding: 9px 14px 15px;
  max-height: calc(100vh - 100px); overflow-y: auto;
}
.popover[hidden] { display: none; }
.popover section { padding-top: 13px; }
.popover h2 {
  margin: 0 0 7px; font-size: 9px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.hint { margin: 7px 0 0; font-size: 10.5px; line-height: 1.5; color: var(--muted); }

/* Segmented control: every mode visible at once, rather than a button you
   have to click repeatedly to discover what it cycles through. */
.seg {
  display: flex; border: 1px solid var(--edge);
  border-radius: var(--r); overflow: hidden;
}
.seg button {
  flex: 1; font: inherit; font-size: 10.5px; letter-spacing: .07em;
  text-transform: uppercase; white-space: nowrap;
  padding: 7px 4px; background: transparent; color: var(--fg);
  border: 0; cursor: pointer; transition: background-color .12s ease;
}
.seg button + button { border-left: 1px solid var(--edge); }
.seg button:hover[aria-checked="false"] { background: rgba(127,127,127,.14); }
.seg button[aria-checked="true"] { background: var(--accent); color: #14140f; }

.btn {
  font: inherit; font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--page-fg); background: transparent;
  border: 1px solid var(--page-line); border-radius: var(--r);
  padding: 6px 10px; cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover { border-color: currentColor; }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #111; }
.btn:focus-visible, .card__name:focus-visible, .card__remove:focus-visible,
.add:focus-visible, .row:focus-visible, .fab:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.seg button:focus-visible { outline-offset: -2px; }
#search:focus { outline: none; border-bottom-color: var(--accent); box-shadow: 0 1px 0 var(--accent); }

/* ---------------------------------------------------------------- grid */
.grid {
  max-width: 1160px; margin: 0 auto;
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
}

/* ---------------------------------------------------------------- card */
/* --dial and --dial-fg are rewritten inline every second, interpolated from a
   0-1 darkness value, so the watch face fades through twilight on its own. */
.card {
  --dial: #fff;
  --dial-fg: #131311;
  position: relative;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 10px;
  padding: 16px 16px 0;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 8px 24px -18px rgba(0,0,0,.5);
}
.card.dragging { opacity: .35; }
.card.drop-into { outline: 2px solid var(--accent); outline-offset: 2px; }

.card__name {
  font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  padding: 2px 6px; border-radius: var(--r); text-align: center; width: 100%;
  display: block;
}
.card__name b {
  display: block; font-size: 15px; font-weight: 600; letter-spacing: .01em;
  border-bottom: 1px solid transparent; padding-bottom: 1px; display: inline-block;
}
.card__name:hover b { border-bottom-color: currentColor; }
.card__name span {
  display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-top: 4px;
}

.card__remove {
  position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
  font: 15px/1 var(--font); cursor: pointer; opacity: 0;
  transition: opacity .15s ease, color .15s ease;
}
.card:hover .card__remove, .card__remove:focus-visible { opacity: 1; }
.card__remove:hover { color: var(--fg); }

.clock { display: block; width: 100%; max-width: 218px; margin: 8px 0 0; }
.clock text { font-family: var(--font); }

/* The sky dome closes the card. It and the sunrise/sunset labels share a width
   so the labels sit directly under the ends of the arc. */
.skyband { width: 100%; max-width: 210px; margin: 4px 0 10px; }
.dome { display: block; width: 100%; overflow: visible; }

.digital { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.digital time {
  font-size: 26px; font-weight: 300; letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  cursor: pointer; border-bottom: 1px dashed transparent; padding-bottom: 1px;
}
.digital time:hover { border-bottom-color: var(--muted); }

/* Typing a time in any card converts it across every other card. */
.tedit {
  font: inherit; font-size: 26px; font-weight: 300; letter-spacing: .01em;
  font-variant-numeric: tabular-nums; text-align: center;
  width: 6.4ch; padding: 0 0 1px; margin: 0;
  background: transparent; color: var(--fg);
  border: 0; border-bottom: 2px solid var(--accent); border-radius: 0;
}
.tedit:focus { outline: none; }
.tedit.bad { border-bottom-color: #cf3b2f; }
.card.editing { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A stopped second hand reads as stopped, but dim it so it is unmistakable. */
html.frozen .hand-sec { opacity: .3; }

.note {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 27; display: flex; align-items: center; gap: 7px;
  background: var(--face); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 100px;
  padding: 8px 15px; font-size: 11px; letter-spacing: .05em;
  box-shadow: 0 3px 10px rgba(0,0,0,.14), 0 16px 40px -22px rgba(0,0,0,.6);
}
.note[hidden] { display: none; }
.note kbd {
  font: inherit; font-size: 10px; letter-spacing: .06em;
  border: 1px solid var(--edge); border-radius: 3px; padding: 1px 5px;
  background: rgba(127,127,127,.12);
}
.digital time small { font-size: 12px; font-weight: 400; letter-spacing: .06em; margin-left: 2px; }
.digital .rel {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}

.sun {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; margin-top: 1px;
  font-size: 11px; letter-spacing: .06em; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.sun .sun-polar, .sun .wx-now { margin: 0 auto; }
.sun .wx-now { display: inline-flex; align-items: center; gap: 4px; }
.sun .wx-now:empty { display: none; }
.sun > span { display: inline-flex; align-items: center; gap: 4px; }
.sun svg { width: 14px; height: 14px; flex: none; opacity: .9; }

/* Only the nearer of the two working-day boundaries, quietly, at the foot. */
.next {
  width: 100%; padding: 9px 4px 12px; text-align: center;
  border-top: 1px solid var(--edge);
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.next b { font-weight: 500; color: var(--fg); opacity: .75; text-transform: none; }

/* ------------------------------------------------------------- add tile */
.add {
  border: 1px dashed var(--page-line); border-radius: 10px; background: transparent;
  color: var(--page-muted); font: inherit; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; cursor: pointer; min-height: 148px; align-self: start;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  transition: color .15s ease, border-color .15s ease;
}
.add:hover { color: var(--page-fg); border-color: currentColor; }
.add svg { width: 22px; height: 22px; }

/* -------------------------------------------------------------- picker */
.sheet {
  position: fixed; inset: 0; z-index: 20; display: none;
  align-items: flex-start; justify-content: center;
  padding: max(8vh, 40px) 16px 16px;
  background: rgba(20,20,18,.42); backdrop-filter: blur(3px);
}
.sheet.open { display: flex; }
.panel {
  width: 100%; max-width: 460px; max-height: 76vh;
  background: var(--page); color: var(--page-fg);
  border: 1px solid var(--page-line); border-radius: 10px;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,.6);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel header {
  padding: 14px 16px 12px; border-bottom: 1px solid var(--page-line);
}
.panel header p {
  margin: 0 0 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--page-muted);
}
#search {
  width: 100%; font: inherit; font-size: 16px; color: inherit;
  background: transparent; border: 0; border-bottom: 1px solid var(--page-line);
  padding: 4px 0 8px; border-radius: 0;
}
#search::placeholder { color: var(--page-muted); }
.list { overflow-y: auto; padding: 6px; }
.row {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  font: inherit; text-align: left; color: inherit;
  background: transparent; border: 0; border-radius: var(--r);
  padding: 9px 10px; cursor: pointer;
}
.row[aria-selected="true"] { background: rgba(127,127,127,.16); }
.row b { font-weight: 500; font-size: 14px; }
.row span { font-size: 11px; color: var(--page-muted); letter-spacing: .04em; }
.row time {
  margin-left: auto; font-size: 12px; color: var(--page-muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.list .empty { padding: 18px 10px; font-size: 13px; color: var(--page-muted); }
.panel footer {
  border-top: 1px solid var(--page-line); padding: 10px 12px;
  display: flex; gap: 8px; justify-content: space-between;
}

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
  background: var(--page-fg); color: var(--page);
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  padding: 9px 14px; border-radius: 100px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; z-index: 30;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Phones get one column — auto-fill already does that, so only trim the chrome.
   Forcing two columns here overflows: the working-hours labels don't wrap. */
@media (max-width: 420px) {
  .grid { gap: 12px; }
  .card { padding: 14px 12px 10px; }
  .digital time { font-size: 24px; }
}
</style>
</head>
<body>

<h1 class="sr-only">Timezones</h1>

<main class="grid" id="grid"></main>

<div class="dock" id="dock">
  <button class="fab" id="share" title="Copy a link to this board" aria-label="Copy a link to this board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M9 17H7.5a5 5 0 0 1 0-10H9"/><path d="M15 7h1.5a5 5 0 0 1 0 10H15"/><path d="M8.5 12h7"/>
    </svg>
  </button>
  <button class="fab" id="menu" title="Settings" aria-label="Settings"
    aria-expanded="false" aria-controls="settings">
    <svg class="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
    </svg>
    <svg class="ico-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
    </svg>
  </button>
</div>

<div class="popover" id="settings" hidden>
  <section>
    <h2>Time format</h2>
    <div class="seg" role="radiogroup" aria-label="Time format" data-group="hour12">
      <button type="button" role="radio" data-val="0">24-hour</button>
      <button type="button" role="radio" data-val="1">12-hour</button>
    </div>
  </section>
  <section>
    <h2>Dark clock face</h2>
    <div class="seg" role="radiogroup" aria-label="What makes a clock face dark" data-group="solar">
      <button type="button" role="radio" data-val="0">Working hours</button>
      <button type="button" role="radio" data-val="1">Real sun</button>
    </div>
    <p class="hint" id="hint-solar"></p>
  </section>
  <section>
    <h2>Weather forecast</h2>
    <div class="seg" role="radiogroup" aria-label="Weather forecast" data-group="weather">
      <button type="button" role="radio" data-val="dial">Dial</button>
      <button type="button" role="radio" data-val="dome">Dome</button>
      <button type="button" role="radio" data-val="off">Off</button>
    </div>
    <p class="hint" id="hint-weather"></p>
  </section>
  <section>
    <h2>Page theme</h2>
    <div class="seg" role="radiogroup" aria-label="Page theme" data-group="theme">
      <button type="button" role="radio" data-val="auto">Auto</button>
      <button type="button" role="radio" data-val="light">Light</button>
      <button type="button" role="radio" data-val="dark">Dark</button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <header>
      <p id="sheetTitle">Choose a city</p>
      <input id="search" type="text" placeholder="Search city, country or time zone" autocomplete="off" spellcheck="false">
    </header>
    <div class="list" id="list" role="listbox" aria-label="Cities"></div>
    <footer>
      <button class="btn" id="removeBtn" hidden>Remove clock</button>
      <button class="btn" id="cancelBtn">Cancel</button>
    </footer>
  </div>
</div>

<div class="note" id="frozenNote" hidden>
  <span>Converted time &mdash; clocks paused</span>
  <kbd>Esc</kbd>
  <span>for now</span>
</div>

<div class="toast" id="toast"></div>

/* =======================================================================
   Time-zone helpers
   ======================================================================= */
const partFmts = new Map();
function partsFor(tz, date) {
  let f = partFmts.get(tz);
  if (!f) {
    f = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    partFmts.set(tz, f);
  }
  const o = {};
  for (const p of f.formatToParts(date)) if (p.type !== "literal") o[p.type] = +p.value;
  // Wall-clock time in the zone, plus the zone's offset from UTC in minutes.
  const asUTC = Date.UTC(o.year, o.month - 1, o.day, o.hour, o.minute, o.second);
  const offset = Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
  return {
    y: o.year, mo: o.month, d: o.day, h: o.hour, mi: o.minute, s: o.second,
    offset, minutes: o.hour * 60 + o.minute + o.second / 60,
    midnightUTC: Date.UTC(o.year, o.month - 1, o.day) - offset * 60000
  };
}

function offsetLabel(min) {
  const sign = min < 0 ? "−" : "+";
  const a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
  return "GMT" + (a === 0 ? "" : sign + h + (m ? ":" + String(m).padStart(2, "0") : ""));
}

function clockText(h, mi, hour12) {
  if (!hour12) return { t: String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0"), suffix: "" };
  const ap = h < 12 ? "am" : "pm";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return { t: hh + ":" + String(mi).padStart(2, "0"), suffix: ap };
}

// A minutes-past-midnight value as a wall-clock label: "18:00" or "6 pm".
function stamp(min, hour12) {
  const v = ((min % 1440) + 1440) % 1440;
  const t = clockText(Math.floor(v / 60), Math.floor(v % 60), hour12);
  if (!hour12) return t.t;
  return (v % 60 === 0 ? t.t.slice(0, -3) : t.t) + " " + t.suffix;
}

function fmtDur(min) {
  const total = Math.max(0, Math.round(min));
  const h = Math.floor(total / 60), m = total % 60;
  if (h === 0) return m + "m";
  return h + "h " + String(m).padStart(2, "0") + "m";
}

/* =======================================================================
   Sunrise / sunset — NOAA "sunrise equation"
   ======================================================================= */
const RAD = Math.PI / 180;
const toJulian = ms => ms / 86400000 + 2440587.5;
const fromJulian = j => (j - 2440587.5) * 86400000;

function sunTimes(lat, lon, localNoonUTCms) {
  const lw = -lon;
  const n = Math.round(toJulian(localNoonUTCms) - 2451545 - 0.0009 - lw / 360);
  const Js = 2451545 + 0.0009 + lw / 360 + n;                      // mean solar noon
  const M = (357.5291 + 0.98560028 * (Js - 2451545)) % 360;        // solar mean anomaly
  const C = 1.9148 * Math.sin(M * RAD) + 0.02 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
  const L = (M + C + 180 + 102.9372) % 360;                        // ecliptic longitude
  const Jtransit = Js + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * L * RAD);
  const sinDec = Math.sin(L * RAD) * Math.sin(23.4397 * RAD);
  const cosDec = Math.cos(Math.asin(sinDec));
  // transit and declination are kept for the altitude calculation below.
  const out = { transit: fromJulian(Jtransit), sinDec, cosDec };
  const cosW = (Math.sin(-0.833 * RAD) - Math.sin(lat * RAD) * sinDec) / (Math.cos(lat * RAD) * cosDec);
  if (cosW > 1) { out.polar = "night"; return out; }                // sun never rises
  if (cosW < -1) { out.polar = "day"; return out; }                 // sun never sets
  const w = Math.acos(cosW) / RAD;
  out.sunrise = fromJulian(Jtransit - w / 360);
  out.sunset = fromJulian(Jtransit + w / 360);
  return out;
}

// Height of the sun above the horizon, in degrees. Works everywhere, including
// latitudes where the sun never rises or sets.
function altitudeAt(lat, sun, nowMs) {
  const H = 360 * (nowMs - sun.transit) / 86400000;   // hour angle from solar noon
  const s = Math.sin(lat * RAD) * sun.sinDec +
            Math.cos(lat * RAD) * sun.cosDec * Math.cos(H * RAD);
  return Math.asin(Math.max(-1, Math.min(1, s))) / RAD;
}

const sunCache = new Map();

// dayOffset of -1 / +1 gives the neighbouring local day, which is what the
// night span needs: yesterday's sunset, or tomorrow's sunrise.
function sunForOffset(city, parts, dayOffset) {
  const noon = parts.midnightUTC + dayOffset * 86400000 + 12 * 3600000;
  const key = city.id + "|" + noon;
  let v = sunCache.get(key);
  if (!v) {
    v = sunTimes(city.lat, city.lon, noon);
    if (sunCache.size > 400) sunCache.clear();
    sunCache.set(key, v);
  }
  return v;
}
const sunFor = (city, parts) => sunForOffset(city, parts, 0);

  get(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

function parseIds(raw) {
  return raw.split(",").map(s => s.trim()).filter(Boolean).map(tok => {
    const t = tok.toLowerCase();
    if (BY_ID.has(slug(t))) return slug(t);
    const byTz = CITIES.find(c => c.tz.toLowerCase() === t.replace(/ /g, "_"));
    if (byTz) return byTz.id;
    const loose = CITIES.find(c => c.hay.includes(t));
    return loose ? loose.id : null;
  }).filter(Boolean);
}

if (!state.ids.length) state.ids = parseIds(store.get(LS.cities, ""));
if (!state.ids.length) state.ids = DEFAULTS.slice();

function persist() {
  store.set(LS.cities, state.ids.join(","));
  const q = new URLSearchParams(location.search);
  q.set("cities", state.ids.join(","));

  try {
    history.replaceState(null, "", location.pathname + "?" + q.toString() + location.hash);
  } catch {}
}

function wxIcon(code, sunUp) {

const WX_TTL = 30 * 60 * 1000;         // refetch a city at most twice an hour
const wxData = new Map();              // cityId -> {at, rows:[[epochMs, code, temp]]}
const wxPending = new Set();

function wxRead(city) {
  if (wxData.has(city.id)) return wxData.get(city.id);
  try {
    const raw = localStorage.getItem("worldclock.wx." + city.id);
    if (raw) {
      const v = JSON.parse(raw);
      wxData.set(city.id, v);
      return v;
    }
  } catch {}
  return null;
}

function wxEnsure(city, onLoad) {
  if (state.weather === "off") return wxRead(city);
  const have = wxRead(city);
  if (have && Date.now() - have.at < WX_TTL) return have;
  if (wxPending.has(city.id)) return have;
  wxPending.add(city.id);

  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat +
    "&longitude=" + city.lon + "&hourly=weather_code,temperature_2m" +
    "&forecast_days=3&timeformat=unixtime&timezone=UTC";
  fetch(url)
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(j => {
      const t = j.hourly.time, c = j.hourly.weather_code, temp = j.hourly.temperature_2m;
      const rows = t.map((sec, i) => [sec * 1000, c[i], temp[i]]);
      const v = { at: Date.now(), rows };
      wxData.set(city.id, v);
      try { localStorage.setItem("worldclock.wx." + city.id, JSON.stringify(v)); } catch {}
      onLoad();
    })
    .catch(() => { /* offline or blocked: the dome simply shows no icons */ })
    .finally(() => wxPending.delete(city.id));
  return have;
}

const CX = 100, CY = 100;

/* -----------------------------------------------------------------------
   The sky dome above each dial. The horizontal axis is not clock time — it
   is progress through the current daylight (or the current night), so the
   left edge is always sunrise and the right edge always sunset however long
   the day happens to be. Nothing here can be misread as a clock angle.
   ----------------------------------------------------------------------- */
const SKY = {
  h: 100,       // viewBox height; the extra room is for the forecast icons
  y: 62,        // the horizon

  rise: 42,     // how high the sun climbs above the horizon at midday

const skyY = (t, up) => SKY.y + (up ? -SKY.rise : SKY.dip) * Math.sin(Math.PI * t);

  <g class="sky-sun">
    <circle r="8.4" fill="var(--sun)" opacity=".17"/>
    ${rays}
    <circle r="3.4" fill="var(--sun)"/>
  </g>
  <g class="sky-moon" style="display:none">
    <circle r="7.4" fill="var(--moon)" opacity=".13"/>
    <path d="M0 -4.2 A 4.2 4.2 0 0 0 0 4.2 A 5.9 5.9 0 0 1 0 -4.2 Z" fill="var(--moon)"/>
  </g>`;
}

function domeSVG() {
  const { y, x0, x1, rise, dip } = SKY;
  const day = `M ${x0} ${y} A 82 ${rise} 0 0 1 ${x1} ${y}`;
  const night = `M ${x0} ${y} A 82 ${dip} 0 0 0 ${x1} ${y}`;
  return `
  <path class="dome-fill" d="${day} Z" fill="var(--sun)" opacity=".08"/>
  <path class="dome-day" d="${day}" fill="none" stroke="var(--sun)" stroke-width="1.5" opacity=".55"/>
  <path class="dome-night" d="${night}" fill="none" stroke="currentColor" stroke-width="1"
    stroke-dasharray="2 3" opacity=".22"/>
  <line x1="6" y1="${y}" x2="194" y2="${y}" stroke="currentColor" stroke-width="1" opacity=".28"/>
  <line x1="${x0}" y1="${y - 4}" x2="${x0}" y2="${y + 4}" stroke="currentColor" stroke-width="1" opacity=".4"/>
  <line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="currentColor" stroke-width="1" opacity=".4"/>
  <g class="wx"></g>
  <g class="sky-body" transform="translate(${x0} ${y})">${skyBodies()}</g>`;
}

const DIAL = 92;      // dial disc radius
const WXRING = 105;   // where the hourly forecast icons sit, outside the dial

function faceSVG() {
  let ticks = "";
  for (let i = 0; i < 60; i++) {
    const hour = i % 5 === 0;
    const a = i * 6;
    const [x1, y1] = pol(hour ? 76 : 80.5, a);
    const [x2, y2] = pol(85, a);
    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"
      stroke="var(--dial-fg)" stroke-width="${hour ? 2.6 : 1}" opacity="${hour ? .92 : .3}" stroke-linecap="butt"/>`;
  }
  let nums = "";
  for (const [n, a] of [[12, 0], [3, 90], [6, 180], [9, 270]]) {
    const [x, y] = pol(63, a);
    nums += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central"
      font-size="12" font-weight="500" fill="var(--dial-fg)" opacity=".8">${n}</text>`;
  }
  return `
  <circle cx="${CX}" cy="${CY}" r="${DIAL}" fill="var(--dial)" stroke="var(--edge)" stroke-width="1"/>
  <g class="wxring"></g>
  <g>${ticks}${nums}</g>
  <g class="hand-hour"  transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 3.1}" y="${CY - 52}" width="6.2" height="60" rx="1.4" fill="var(--dial-fg)"/>
  </g>
  <g class="hand-min" transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 2.2}" y="${CY - 74}" width="4.4" height="84" rx="1.1" fill="var(--dial-fg)"/>
  </g>
  <g class="hand-sec" transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 0.75}" y="${CY - 78}" width="1.5" height="96" rx="0.75" fill="var(--accent)"/>
    <circle cx="${CX}" cy="${CY}" r="3.6" fill="var(--accent)"/>
  </g>
  <circle cx="${CX}" cy="${CY}" r="1.5" fill="var(--dial)"/>`;
}

/* =======================================================================
   Cards
   ======================================================================= */
const grid = document.getElementById("grid");
let cards = [];
let dragFrom = null;

function buildCards() {
  stopEdit();          // the card holding the editor is about to be replaced
  grid.textContent = "";
  cards = state.ids.map((id, i) => {
    const city = BY_ID.get(id) || BY_ID.get(DEFAULTS[0]);
    const el = document.createElement("article");
    el.className = "card day";
    el.innerHTML = `
      <button class="card__remove" title="Remove" aria-label="Remove ${city.name}">&times;</button>
      <button class="card__name" title="Change city">
        <b>${city.name}</b><span class="meta"></span>
      </button>
      <svg class="clock" viewBox="${state.weather === "dial" ? "-14 -14 228 228" : "-4 -4 208 208"}"
        role="img" aria-label="Analog clock for ${city.name}">${faceSVG()}</svg>
      <div class="digital">
        <time title="Click to convert a time across every city"></time>
        <input class="tedit" type="text" inputmode="text" autocomplete="off"
          spellcheck="false" draggable="false" hidden
          aria-label="Convert a time in ${city.name} across every city">
        <span class="rel"></span>
      </div>
      <div class="skyband">
        <svg class="dome" viewBox="0 0 200 ${SKY.h}" aria-hidden="true">${domeSVG()}</svg>
        <div class="sun">
          <span class="sun-rise" title="Sunrise">${ICON_SUNRISE}<span class="rise"></span></span>
          <span class="sun-polar" hidden></span>
          <span class="wx-now"></span>
          <span class="sun-set" title="Sunset"><span class="set"></span>${ICON_SUNSET}</span>
        </div>
      </div>
      <div class="next"></div>`;
    el.querySelector(".card__name").addEventListener("click", () => openPicker(i));
    el.querySelector(".card__remove").addEventListener("click", () => removeAt(i));

    // ---- click the time to convert one across every city
    const timeEl = el.querySelector("time");
    const editEl = el.querySelector(".tedit");
    timeEl.addEventListener("click", () => startEdit(i));
    editEl.addEventListener("input", () => applyTyped(i));
    editEl.addEventListener("blur", stopEdit);
    editEl.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.stopPropagation(); stopEdit(); }
      else if (e.key === "Enter") { e.preventDefault(); editEl.select(); }
    });

    // ---- drag to reorder
    el.draggable = true;
    el.addEventListener("dragstart", e => {
      dragFrom = i;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", city.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      for (const o of cards) o.el.classList.remove("drop-into");
      dragFrom = null;
    });
    el.addEventListener("dragover", e => {
      if (dragFrom === null || dragFrom === i) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      el.classList.add("drop-into");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-into"));
    el.addEventListener("drop", e => {
      e.preventDefault();
      el.classList.remove("drop-into");
      if (dragFrom === null || dragFrom === i) return;
      moveCard(dragFrom, i);
    });
    grid.appendChild(el);
    return {
      city, el,
      meta: el.querySelector(".meta"),
      time: el.querySelector("time"),
      tedit: el.querySelector(".tedit"),
      rel: el.querySelector(".rel"),
      rise: el.querySelector(".rise"),
      set: el.querySelector(".set"),
      sunRise: el.querySelector(".sun-rise"),
      sunSet: el.querySelector(".sun-set"),
      sunPolar: el.querySelector(".sun-polar"),
      hourHand: el.querySelector(".hand-hour"),
      minHand: el.querySelector(".hand-min"),
      secHand: el.querySelector(".hand-sec"),
      domeDay: el.querySelector(".dome-day"),
      domeNight: el.querySelector(".dome-night"),
      domeFill: el.querySelector(".dome-fill"),
      wx: el.querySelector(".wx"),
      wxNow: el.querySelector(".wx-now"),
      body: el.querySelector(".sky-body"),
      skySun: el.querySelector(".sky-sun"),
      skyMoon: el.querySelector(".sky-moon"),
      next: el.querySelector(".next"),
      wxRing: el.querySelector(".wxring")
    };
  });

  const add = document.createElement("button");
  add.className = "add";
  add.draggable = false;
  add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add city`;
  add.addEventListener("click", () => openPicker(-1));
  grid.appendChild(add);
}

/* -----------------------------------------------------------------------
   Configuration — the only numbers you need to touch to reshape the day.
   ----------------------------------------------------------------------- */
const CONFIG = {
  morning:   8 * 60,   // 08:00 — start of the working day
  evening:  18 * 60,   // 18:00 — end of the working day
  nightFrom: 20 * 60,  // 20:00 — the clock face turns black  ("hours" mode)
  nightTo:    6 * 60,  // 06:00 — the clock face turns white again
  fade:          45,   // minutes either side of those, spent fading
  dayAbove:       2,   // sun this high  = full daylight        ("solar" mode)
  nightBelow:    -6    // sun this low   = full dark (civil twilight)
};
const isNight = m => m >= CONFIG.nightFrom || m < CONFIG.nightTo;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = t => t * t * (3 - 2 * t);
// Signed shortest distance in minutes between two points on a 24-hour circle.
const cyc = d => { const x = ((d % 1440) + 1440) % 1440; return x > 720 ? x - 1440 : x; };

// 0 = full daylight, 1 = full dark. Two ways of deciding, both continuous.
function darkness(city, sun, p, nowMs) {
  if (state.solar) {
    const alt = altitudeAt(city.lat, sun, nowMs);
    return smooth(clamp01((CONFIG.dayAbove - alt) /
                          (CONFIG.dayAbove - CONFIG.nightBelow)));
  }
  const m = p.minutes;
  const edge = Math.min(Math.abs(cyc(m - CONFIG.nightFrom)),
                        Math.abs(cyc(m - CONFIG.nightTo)));
  const half = smooth(clamp01(edge / CONFIG.fade)) / 2;
  return isNight(m) ? 0.5 + half : 0.5 - half;
}

/* Only the watch face fades — the card surface and its text come from the page
   theme, so a city at dusk never leaves grey text on a grey card.
   The dial runs white -> warm dusk -> near black. Its markings do NOT
   interpolate: at the midpoint they would land on the same grey as the dial and
   vanish, which is the exact problem the fade was meant to avoid. They step
   instead, and both halves stay legible (black on mid grey is about 5:1,
   white on mid grey about 4:1). */
const DIAL_STOPS = [[255, 255, 255], [138, 133, 120], [16, 16, 16]];

function rampColour(stops, k) {
  const span = 1 / (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(k / span));
  const t = (k - i * span) / span;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},` +
         `${Math.round(a[1] + (b[1] - a[1]) * t)},` +
         `${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}

function applyPalette(el, k) {
  el.style.setProperty("--dial", rampColour(DIAL_STOPS, k));
  el.style.setProperty("--dial-fg", k < 0.5 ? "#131311" : "#f2f2ef");
}

const viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const wrapDay = v => ((v % 1440) + 1440) % 1440;
let toolsRev = 0;   // bumped when 12/24h changes, to force a text refresh

function update() {
  // While a time is being converted the whole board runs off that instant
  // instead of the clock, which is what stops the hands.
  const nowMs = state.frozen != null ? state.frozen : Date.now();
  const now = new Date(nowMs);
  // Seconds come straight off the epoch rather than the formatted parts, so the
  // sweep is perfectly continuous and identical on every card. Every IANA zone
  // is a whole number of minutes from UTC, so seconds-of-minute are universal.
  const secs = (nowMs % 60000) / 1000;
  const viewer = partsFor(viewerTz, now);
  const viewerDay = Date.UTC(viewer.y, viewer.mo - 1, viewer.d);
  let nightCount = 0;

  for (const c of cards) {
    const p = partsFor(c.city.tz, now);

    // ---- hands: all three drift continuously; the second hand floats, never ticks
    c.secHand.setAttribute("transform", `rotate(${secs * 6} ${CX} ${CY})`);
    c.minHand.setAttribute("transform", `rotate(${(p.mi + secs / 60) * 6} ${CX} ${CY})`);
    c.hourHand.setAttribute("transform", `rotate(${((p.h % 12) + p.mi / 60 + secs / 3600) * 30} ${CX} ${CY})`);

    // Text and the dome only change once a second — no need to touch the DOM
    // for them 60 times a second. This also establishes the span the body is
    // crossing, so it has to run before the body is placed.
    const rev = p.h * 3600 + p.mi * 60 + p.s + toolsRev * 1e7;
    if (c._rev !== rev) {
      c._rev = rev;
      paintSlow(c, p, nowMs, viewerDay);
    }
    if (c._isNight) nightCount++;

    // ---- the sun (or moon) creeps across the dome in real time
    const t = Math.min(1, Math.max(0, (nowMs - c._spanFrom) / (c._spanTo - c._spanFrom)));
    c.body.setAttribute("transform",
      `translate(${skyX(t).toFixed(2)} ${skyY(t, c._sunUp).toFixed(2)})`);
  }

  // ---- page skin follows the majority of the board when on auto
  const dark = state.theme === "dark" ||
    (state.theme === "auto" && cards.length > 0 && nightCount * 2 > cards.length);
  document.documentElement.classList.toggle("dark", dark);

  requestAnimationFrame(update);
}

function paintSlow(c, p, nowMs, viewerDay) {
  // ---- the sky dome: which span are we in, and where inside it?
  const sun = sunFor(c.city, p);
  let sunUp, from = null, to = null;
  if (sun.polar) {
    // Nothing rises or sets, so run the body across the dome once per day.
    sunUp = sun.polar === "day";
    from = p.midnightUTC;
    to = p.midnightUTC + 86400000;
    c.sunRise.hidden = c.sunSet.hidden = true;
    c.sunPolar.hidden = false;
    c.sunPolar.textContent = sunUp ? "midnight sun" : "polar night";
  } else {
    sunUp = nowMs >= sun.sunrise && nowMs < sun.sunset;
    if (sunUp) {
      from = sun.sunrise; to = sun.sunset;
    } else if (nowMs < sun.sunrise) {
      // Small hours: the span runs from yesterday's sunset to this sunrise.
      const prev = sunForOffset(c.city, p, -1);
      from = prev.sunset != null ? prev.sunset : sun.sunrise - 43200000;
      to = sun.sunrise;
    } else {
      const next = sunForOffset(c.city, p, 1);
      from = sun.sunset;
      to = next.sunrise != null ? next.sunrise : sun.sunset + 43200000;
    }
    c.rise.textContent = stamp(wrapDay((sun.sunrise - p.midnightUTC) / 60000), state.hour12);
    c.set.textContent = stamp(wrapDay((sun.sunset - p.midnightUTC) / 60000), state.hour12);
    c.sunRise.hidden = c.sunSet.hidden = false;
    c.sunPolar.hidden = true;
  }
  c._spanFrom = from; c._spanTo = to; c._sunUp = sunUp;
  // Sun while it is actually above the horizon, moon once it has set.
  c.skySun.style.display = sunUp ? "" : "none";
  c.skyMoon.style.display = sunUp ? "none" : "";
  // Light the half of the dome we are actually in; the other half stays a
  // faint track. The warm sky fill would read as a brown mass at night.
  c.domeDay.style.opacity = sunUp ? ".55" : ".18";
  c.domeNight.style.opacity = sunUp ? ".12" : ".4";
  c.domeFill.style.opacity = sunUp ? ".085" : "0";

  // ---- day / night skin, faded rather than flipped
  const k = darkness(c.city, sun, p, nowMs);
  c._isNight = k > 0.5;
  if (c._k === undefined || Math.abs(c._k - k) > 0.002) {
    c._k = k;
    applyPalette(c.el, k);
  }
  c.el.classList.toggle("day", k <= 0.5);
  c.el.classList.toggle("night", k > 0.5);

  // ---- forecast icons along the dome
  paintWeather(c, nowMs, sunUp);

  // ---- digital read-out
  const t = clockText(p.h, p.mi, state.hour12);
  c.time.innerHTML = t.t + (t.suffix ? `<small>${t.suffix}</small>` : "");
  c.meta.textContent = c.city.place + " · " + offsetLabel(p.offset);

  const dayDelta = Math.round((Date.UTC(p.y, p.mo - 1, p.d) - viewerDay) / 86400000);
  c.rel.textContent = dayDelta === 0 ? "today" : dayDelta === 1 ? "tomorrow"
    : dayDelta === -1 ? "yesterday" : (dayDelta > 0 ? "+" : "−") + Math.abs(dayDelta) + "d";

  // ---- whichever working-day boundary comes round next, and nothing else
  const m = p.minutes;
  const { morning, evening } = CONFIG;
  const toMorning = wrapDay(morning - m), toEvening = wrapDay(evening - m);
  const morningNext = toMorning <= toEvening;
  const mins = morningNext ? toMorning : toEvening;
  c.next.innerHTML = `<b>${fmtDur(mins)}</b> till ${morningNext ? "morning" : "evening"} ` +
    stamp(morningNext ? morning : evening, state.hour12);
}

/* -----------------------------------------------------------------------
   Forecast icons ride the dome alongside the sun, so they cover the span we
   are currently in: now until sunset by day, now until sunrise by night.
   Spaced out to at most six so they never collide on a long summer day.
   ----------------------------------------------------------------------- */
function paintWeather(c, nowMs, sunUp) {
  if (state.weather === "off") {
    if (c._wxKey !== "off") {
      c._wxKey = "off";
      c.wx.textContent = ""; c.wxRing.textContent = ""; c.wxNow.textContent = "";
    }
    return;
  }
  const data = wxEnsure(c.city, () => { c._wxKey = null; });
  if (!data) return;

  const hour = Math.floor(nowMs / 3600000);
  const key = state.weather + "|" + hour + "|" + Math.round(c._spanTo / 60000) +
              "|" + sunUp + "|" + data.at;
  if (c._wxKey === key) return;
  c._wxKey = key;

  // Current conditions go in the middle of the sunrise/sunset row either way.
  const nowRow = data.rows.find(r => r[0] > nowMs - 3600000 && r[0] <= nowMs + 1800000);
  c.wxNow.innerHTML = nowRow
    ? wxSpan(wxIcon(nowRow[1], sunUp), Math.round(nowRow[2]))
    : "";

  if (state.weather === "dial") {
    c.wx.textContent = "";
    paintDialRing(c, nowMs, data);
    return;
  }
  c.wxRing.textContent = "";

  const ahead = data.rows.filter(r => r[0] > nowMs + 1800000 && r[0] <= c._spanTo);
  if (!ahead.length) { c.wx.textContent = ""; return; }

  // Space the icons by distance along the arc, not by time. skyX is a cosine,
  // so it barely moves near sunrise and sunset while the hours keep passing —
  // picking every Nth hour piles them up at the ends. Seeding from the sun's
  // own position also stops the first icon colliding with it.
  const MIN_GAP = 15;
  const span = c._spanTo - c._spanFrom;
  let lastX = skyX(clamp01((nowMs - c._spanFrom) / span));
  const picks = [];
  for (const [ts, code, temp] of ahead) {
    const t = clamp01((ts - c._spanFrom) / span);
    const x = skyX(t);
    if (Math.abs(x - lastX) < MIN_GAP) continue;
    picks.push([t, x, code, temp]);
    lastX = x;
    if (picks.length === 6) break;
  }

  c.wx.innerHTML = picks.map(([t, x, code, temp]) => {
    const y = skyY(t, sunUp) + (sunUp ? -12.5 : 13.5);
    const key = wxIcon(code, sunUp);
    return wxGlyph(key, x, y, 12.5, "currentColor", `${WX_TEXT[key]}, ${Math.round(temp)}°`);
  }).join("");
  c.wx.style.opacity = ".5";
}

/* The next twelve hours, one icon per hour, arranged outside the dial. The
   analog face already maps hours to angles, so each forecast hour lands on its
   own hour position — including on the half-hour zones, since the angle comes
   from that hour's local wall-clock time rather than from a slot index.
   Opacity falls away with distance in time, which shows the reading direction
   and stops the ring being ambiguous about which icon is the next hour. */
function paintDialRing(c, nowMs, data) {
  const rows = data.rows.filter(r => r[0] > nowMs && r[0] <= nowMs + 12 * 3600000);
  c.wxRing.innerHTML = rows.map((row, i) => {
    const [ts, code, temp] = row;
    const at = new Date(ts);
    const p2 = partsFor(c.city.tz, at);
    const sun2 = sunFor(c.city, p2);
    const up = sun2.polar ? sun2.polar === "day" : (ts >= sun2.sunrise && ts < sun2.sunset);
    const angle = ((p2.minutes % 720) / 720) * 360;
    const [x, y] = pol(WXRING, angle);
    const key = wxIcon(code, up);
    const label = `${stamp(p2.minutes, state.hour12)} · ${WX_TEXT[key]}, ${Math.round(temp)}°`;
    return wxGlyph(key, x, y, 15, "currentColor", label,
                   0.8 - 0.45 * (i / Math.max(1, rows.length - 1)));
  }).join("");
}

function wxSpan(key, temp) {
  return `<svg viewBox="0 0 16 16" aria-hidden="true">${
    `<g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
       stroke-linejoin="round">${WX[key]}</g>`}</svg><span>${temp}°</span>`;
}

/* =======================================================================
   Converting a time

   Click any digital read-out and the whole board pauses on that instant, so
   a time someone quotes in their own zone can be read straight off every
   other card. Because everything downstream keys off the same instant, the
   sky domes, the dial darkness and the working-hours line all describe that
   moment too, not just the digits.
   ======================================================================= */
let editing = null;      // index of the card being edited
let editAnchor = null;   // that city's local date, held still while typing
const frozenNote = document.getElementById("frozenNote");

// "14:30", "1430", "930", "2.30", "2:30pm", "9a", "14" ...
function parseTimeInput(raw) {
  const s = raw.trim().toLowerCase().replace(/\s+/g, "");
  if (!s) return null;
  const suffix = /([ap])\.?m?\.?$/.exec(s);
  const body = (suffix ? s.slice(0, suffix.index) : s).replace(/[.h]/g, ":");
  let h, m;
  if (body.includes(":")) {
    const [a, b = "0"] = body.split(":");
    if (!/^\d{1,2}$/.test(a) || !/^\d{1,2}$/.test(b)) return null;
    h = +a; m = +b;
  } else if (/^\d{1,2}$/.test(body)) { h = +body; m = 0; }
  else if (/^\d{3}$/.test(body)) { h = +body[0]; m = +body.slice(1); }
  else if (/^\d{4}$/.test(body)) { h = +body.slice(0, 2); m = +body.slice(2); }
  else return null;
  if (suffix) {
    if (h < 1 || h > 12) return null;
    h = (h % 12) + (suffix[1] === "p" ? 12 : 0);
  }
  if (h > 23 || m > 59) return null;
  return { h, m };
}

// The instant at which a given zone's wall clock reads y-mo-d h:mi. Solved by
// correction rather than by assuming an offset, since the offset in force is
// itself a function of the answer. Two passes settle it, including across a
// daylight-saving change.
function zonedTimeToEpoch(tz, y, mo, d, h, mi) {
  const target = Date.UTC(y, mo - 1, d, h, mi);
  let guess = target;
  for (let i = 0; i < 2; i++) {
    const p = partsFor(tz, new Date(guess));
    guess += target - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  }
  return guess;
}

const repaintAll = () => { for (const c of cards) c._rev = null; };

function startEdit(i) {
  if (editing === i) return;
  if (editing !== null) stopEdit();
  const c = cards[i];
  editing = i;
  const p = partsFor(c.city.tz, new Date());
  editAnchor = { y: p.y, mo: p.mo, d: p.d };
  // Freeze on the current minute so the second hand parks at twelve.
  state.frozen = zonedTimeToEpoch(c.city.tz, p.y, p.mo, p.d, p.h, p.mi);
  c.time.hidden = true;
  c.tedit.hidden = false;
  c.tedit.classList.remove("bad");
  c.tedit.value = stamp(p.h * 60 + p.mi, state.hour12);
  c.tedit.focus();
  c.tedit.select();
  c.el.classList.add("editing");
  document.documentElement.classList.add("frozen");
  frozenNote.hidden = false;
  // A draggable card swallows text selection inside its own input.
  for (const k of cards) k.el.draggable = false;
  repaintAll();
}

function applyTyped(i) {
  const c = cards[i];
  const t = parseTimeInput(c.tedit.value);
  c.tedit.classList.toggle("bad", !t);
  if (!t) return;                     // keep the last good instant while typing
  state.frozen = zonedTimeToEpoch(c.city.tz, editAnchor.y, editAnchor.mo, editAnchor.d, t.h, t.m);
  repaintAll();
}

function stopEdit() {
  if (editing === null) return;
  const c = cards[editing];
  editing = null;
  editAnchor = null;
  state.frozen = null;
  if (c) {
    c.tedit.hidden = true;
    c.time.hidden = false;
    c.el.classList.remove("editing");
  }
  document.documentElement.classList.remove("frozen");
  frozenNote.hidden = true;
  for (const k of cards) k.el.draggable = true;
  repaintAll();
}

/* =======================================================================
   Mutations
   ======================================================================= */
function removeAt(i) {
  if (state.ids.length <= 1) { toast("Keep at least one clock"); return; }
  state.ids.splice(i, 1);
  persist(); buildCards();
}
function setAt(i, id) {
  if (i < 0) state.ids.push(id); else state.ids[i] = id;
  persist(); buildCards();
}
function moveCard(from, to) {
  const [id] = state.ids.splice(from, 1);
  state.ids.splice(to, 0, id);
  persist(); buildCards();
}

/* =======================================================================
   City picker
   ======================================================================= */
const sheet = document.getElementById("sheet");
const search = document.getElementById("search");
const list = document.getElementById("list");
const removeBtn = document.getElementById("removeBtn");
let target = -1, matches = [], cursor = 0;

function openPicker(i) {
  target = i;
  document.getElementById("sheetTitle").textContent =
    i < 0 ? "Add a city" : "Replace " + (BY_ID.get(state.ids[i]) || {}).name;
  removeBtn.hidden = i < 0 || state.ids.length <= 1;
  search.value = "";
  sheet.classList.add("open");
  renderList("");
  search.focus();
}
function closePicker() { sheet.classList.remove("open"); target = -1; }

function renderList(q) {
  const query = q.trim().toLowerCase();
  const terms = query.split(/\s+/).filter(Boolean);
  const rank = c => {
    const n = c.name.toLowerCase(), t = terms[0];
    if (n.startsWith(t)) return 0;
    if (n.includes(t)) return 1;
    if (c.country.toLowerCase().startsWith(t)) return 2;
    return 3;
  };
  matches = (terms.length
    ? CITIES.filter(c => terms.every(t => c.hay.includes(t)))
        .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name))
    : CITIES.slice()
  ).slice(0, 120);
  cursor = 0;
  list.textContent = "";
  if (!matches.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No city matches “" + q.trim() + "”.";
    list.appendChild(p);
    return;
  }
  const now = new Date();
  matches.forEach((c, i) => {
    const p = partsFor(c.tz, now);
    const t = clockText(p.h, p.mi, state.hour12);
    const row = document.createElement("button");
    row.className = "row";
    row.type = "button";
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", i === 0 ? "true" : "false");
    row.innerHTML = `<b></b><span></span><time></time>`;
    row.querySelector("b").textContent = c.name;
    row.querySelector("span").textContent = c.region ? c.region + ", " + c.country : c.country;
    row.querySelector("time").textContent = t.t + (t.suffix ? " " + t.suffix : "");
    row.addEventListener("click", () => { setAt(target, c.id); closePicker(); });
    row.addEventListener("mousemove", () => moveCursor(i, false));
    list.appendChild(row);
  });
}

function moveCursor(i, scroll = true) {
  const rows = list.querySelectorAll(".row");
  if (!rows.length) return;
  cursor = (i + rows.length) % rows.length;
  rows.forEach((r, k) => r.setAttribute("aria-selected", k === cursor ? "true" : "false"));
  if (scroll) rows[cursor].scrollIntoView({ block: "nearest" });
}

search.addEventListener("input", () => renderList(search.value));
search.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(cursor + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(cursor - 1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (matches[cursor]) { setAt(target, matches[cursor].id); closePicker(); }
  }
});
sheet.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });
sheet.addEventListener("mousedown", e => { if (e.target === sheet) closePicker(); });
document.getElementById("cancelBtn").addEventListener("click", closePicker);
removeBtn.addEventListener("click", () => { const i = target; closePicker(); removeAt(i); });

/* =======================================================================
   Settings menu

   Each setting is a segmented control showing every option at once. The
   previous single cycling button gave no clue what it would switch to, and
   two of these are modes rather than on/off toggles, so the selected option
   also gets a line explaining what it does.
   ======================================================================= */
const dock = document.getElementById("dock");
const menuBtn = document.getElementById("menu");
const settings = document.getElementById("settings");

const HINTS = {
  solar: {
    "0": "Every city darkens between 20:00 and 06:00. Identical everywhere, so cards are easy to compare.",
    "1": "Each city darkens at its own dusk, following the real sun. Correct at high latitudes."
  },
  weather: {
    dial: "The next 12 hours, one icon per hour, around the outside of the dial.",
    dome: "The hours left in the current day or night, along the sky dome.",
    off: "No forecast, and no requests to the weather service."
  }
};

const settingValue = group =>
  group === "hour12" ? (state.hour12 ? "1" : "0") :
  group === "solar" ? (state.solar ? "1" : "0") :
  group === "weather" ? state.weather : state.theme;

function syncTools() {
  for (const seg of settings.querySelectorAll(".seg")) {
    const current = settingValue(seg.dataset.group);
    for (const b of seg.querySelectorAll("button")) {
      const on = b.dataset.val === current;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    }
  }
  document.getElementById("hint-solar").textContent = HINTS.solar[settingValue("solar")];
  document.getElementById("hint-weather").textContent = HINTS.weather[state.weather];
}

function applySetting(group, val) {
  if (group === "hour12") {
    state.hour12 = val === "1";
    store.set(LS.hour12, val);
    toolsRev++;                                 // forces the text to repaint
    for (const c of cards) c._wxKey = null;     // and the forecast tooltips
  } else if (group === "solar") {
    state.solar = val === "1";
    store.set(LS.solar, val);
    for (const c of cards) c._k = undefined;    // repaint the dials at once
  } else if (group === "weather") {
    state.weather = val;
    store.set(LS.weather, val);
    syncTools();
    buildCards();                               // the ring needs a roomier viewBox
    return;
  } else {
    state.theme = val;
    store.set(LS.theme, val);
  }
  syncTools();
}

settings.addEventListener("click", e => {
  const b = e.target.closest("button[role=radio]");
  if (b) applySetting(b.parentElement.dataset.group, b.dataset.val);
});

// Arrow keys move through a group, as a radiogroup is expected to.
settings.addEventListener("keydown", e => {
  const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
    : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
  if (!step) return;
  const b = e.target.closest("button[role=radio]");
  if (!b) return;
  e.preventDefault();
  const seg = b.parentElement;
  const all = [...seg.querySelectorAll("button")];
  const next = all[(all.indexOf(b) + step + all.length) % all.length];
  applySetting(seg.dataset.group, next.dataset.val);
  next.focus();
});

function setMenu(open) {
  settings.hidden = !open;
  dock.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
menuBtn.addEventListener("click", () => setMenu(settings.hidden));
document.addEventListener("pointerdown", e => {
  if (settings.hidden || settings.contains(e.target) || dock.contains(e.target)) return;
  setMenu(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !settings.hidden) { setMenu(false); menuBtn.focus(); }
});

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
document.getElementById("share").addEventListener("click", async () => {
  persist();
  try {
    await navigator.clipboard.writeText(location.href);
    toast("Link copied");
  } catch {
    toast(location.href);
  }
});

/* =======================================================================
   Go
   ======================================================================= */
syncTools();
persist();
buildCards();
update();

// The first update() has now settled every card into its day/night skin, so
// re-enable the cross-fades for everything that happens from here on.
requestAnimationFrame(() => requestAnimationFrame(
  () => document.documentElement.classList.remove("booting")));
</script>
</body>
