let moonPhaseAt = -1, moonPhaseVal = null;
function moonPhase(nowMs) {
  const minute = Math.floor(nowMs / 60000);
  if (minute === moonPhaseAt) return moonPhaseVal;
  moonPhaseAt = minute;
  const d = daysSince2000(nowMs);
  const s = sunEq(d), m = moonEq(d), sdist = 149598000;
  const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) +
              Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
  const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
  // Sign of the limb angle says which side of new moon we are on.
  const limb = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
    Math.sin(s.dec) * Math.cos(m.dec) -
    Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
  moonPhaseVal = { fraction: (1 + Math.cos(inc)) / 2, waxing: limb < 0 };
  return moonPhaseVal;
}

const PHASE_NAMES = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous",
  "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];
function phaseName(ph) {
  const f = ph.fraction;
  if (f < 0.04) return PHASE_NAMES[0];
  if (f > 0.96) return PHASE_NAMES[4];
  const near = Math.abs(f - 0.5) < 0.03;
  return ph.waxing
    ? (near ? PHASE_NAMES[2] : f < 0.5 ? PHASE_NAMES[1] : PHASE_NAMES[3])
    : (near ? PHASE_NAMES[6] : f > 0.5 ? PHASE_NAMES[5] : PHASE_NAMES[7]);
}

/* =======================================================================
   Persisted state
   ======================================================================= */
const LS = {
  cities: "worldclock.cities",
  hour12: "worldclock.hour12",
  theme: "worldclock.theme",
  solar: "worldclock.solar",
  shade: "worldclock.shade",
  weather: "worldclock.weather",
  ring: "worldclock.ring",
  units: "worldclock.units",
  density: "worldclock.density"
};
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

function parseIds(raw) {
  return raw.split(",").map(s => s.trim()).filter(Boolean).map(tok => {
    const t = tok.toLowerCase();
    if (BY_ID.has(slug(t))) return slug(t);
    const byTz = CITIES.find(c => c.tz.toLowerCase() === t.replace(/ /g, "_"));
    if (byTz) return byTz.id;
    const loose = CITIES.find(c => c.hay.includes(t));
    return loose ? loose.id : null;
  }).filter(Boolean);
}

const params = new URLSearchParams(location.search);
const urlCities = params.get("cities") || params.get("c");

let state = {
  ids: [],
  hour12: store.get(LS.hour12, "0") === "1",
  theme: store.get(LS.theme, "auto"),      // auto | light | dark
  solar: store.get(LS.solar, "0") === "1", // false = fixed evening hours
  shade: store.get(LS.shade, "card"),      // card | dial: what darkens at night
  weather: store.get(LS.weather, "dial"),  // dial | dome | off
  ring: store.get(LS.ring, "icons"),       // icons | temps | both
  units: store.get(LS.units, "c"),         // c | f
  density: store.get(LS.density, "auto")   // auto | full | compact
};
if (!["auto", "full", "compact"].includes(state.density)) state.density = "auto";

// Four tiles across needs roughly this much room; below it, auto goes compact.
const COMPACT_BELOW = 560;
const compact = () => state.density === "compact" ||
  (state.density === "auto" && window.innerWidth < COMPACT_BELOW);
if (!["card", "dial"].includes(state.shade)) state.shade = "card";
if (!["dial", "dome", "off"].includes(state.weather)) state.weather = "dial";
if (!["icons", "temps", "both"].includes(state.ring)) state.ring = "icons";
if (!["c", "f"].includes(state.units)) state.units = "c";

// Open-Meteo is asked for Celsius and the conversion happens here, so switching
// units costs nothing and never invalidates the cache.
const fmtTemp = c =>
  (state.units === "f" ? Math.round(c * 9 / 5 + 32) : Math.round(c)) + "°";

if (urlCities) state.ids = parseIds(urlCities);
if (!state.ids.length) state.ids = parseIds(store.get(LS.cities, ""));
if (!state.ids.length) state.ids = DEFAULTS.slice();

function persist() {
  store.set(LS.cities, state.ids.join(","));
  const q = new URLSearchParams(location.search);
  q.set("cities", state.ids.join(","));
  q.delete("c");
  // Some browsers reject replaceState on file:// — the dashboard still works.
  try {
    history.replaceState(null, "", location.pathname + "?" + q.toString() + location.hash);
  } catch {}
}

/* =======================================================================
   Icons — sun over a horizon, with the arrow marking which way it is going
   ======================================================================= */
// Kept legible at 14px by giving the pair two differences, not one: the arrow
// direction, and a sun that sits on the horizon at dawn but has dipped below it
// at dusk.
const icon = (sun, arrow) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M1.4 13.2h13.2"/>
  <path d="${sun}"/>
  <path d="M8 2.5v4.4"/>
  <path d="${arrow}"/>
</svg>`;
const ICON_SUNRISE = icon("M4.9 13.2a3.1 3.1 0 0 1 6.2 0", "M5.7 4.8 8 2.5l2.3 2.3");
const ICON_SUNSET  = icon("M4.3 13.2a4.4 4.4 0 0 1 7.4 0", "M5.7 4.6 8 6.9l2.3-2.3");

/* =======================================================================
   Weather — WMO codes from Open-Meteo, drawn as line icons on a 16x16 grid
   so they can be dropped straight onto the dome.
   ======================================================================= */
const WX_CLOUD = "M5.1 12.4h5.9a2.7 2.7 0 0 0 .2-5.4 3.7 3.7 0 0 0-7-.9 2.9 2.9 0 0 0 .9 6.3Z";
const wxRays = (cx, cy, r0, r1) => {
  let s = "";
  for (let i = 0; i < 8; i++) {
    const a = i * 45 * RAD, sn = Math.sin(a), cs = Math.cos(a);
    s += `<path d="M${(cx + sn * r0).toFixed(1)} ${(cy - cs * r0).toFixed(1)}
      L${(cx + sn * r1).toFixed(1)} ${(cy - cs * r1).toFixed(1)}"/>`;
  }
  return s;
};
const WX = {
  clear:  `<circle cx="8" cy="8" r="3.1"/>${wxRays(8, 8, 4.9, 6.8)}`,
  moon:   `<path d="M10.6 3.4a5.2 5.2 0 1 0 2 4.1 4.2 4.2 0 0 1-2-4.1Z"/>`,
  partly: `<circle cx="6" cy="5.6" r="2.3"/>${wxRays(6, 5.6, 3.7, 5)}
           <path d="${WX_CLOUD}"/>`,
  cloud:  `<path d="${WX_CLOUD}"/>`,
  fog:    `<path d="${WX_CLOUD}"/><path d="M3.4 14.4h9.2"/>`,
  drizzle:`<path d="${WX_CLOUD}"/><path d="M6.4 14.1v1.4M9.6 14.1v1.4"/>`,
  rain:   `<path d="${WX_CLOUD}"/><path d="M5.6 13.9 4.9 15.6M8 13.9l-.7 1.7M10.4 13.9l-.7 1.7"/>`,
  snow:   `<path d="${WX_CLOUD}"/><path d="M5.6 14.9h.1M8 14.9h.1M10.4 14.9h.1"/>`,
  storm:  `<path d="${WX_CLOUD}"/><path d="M8.6 13.4 6.6 15.9h2.2l-.6 1.6"/>`
};
// WMO code -> icon key. Anything unmapped falls through to cloud.
function wxIcon(code, sunUp) {
  if (code === 0) return sunUp ? "clear" : "moon";
  if (code === 1 || code === 2) return "partly";
  if (code === 3) return "cloud";
  if (code === 45 || code === 48) return "fog";
  if (code >= 51 && code <= 57) return "drizzle";
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 95) return "storm";
  return "cloud";
}
const WX_TEXT = {
  clear: "Clear", moon: "Clear", partly: "Partly cloudy", cloud: "Overcast",
  fog: "Fog", drizzle: "Drizzle", rain: "Rain", snow: "Snow", storm: "Thunderstorm"
};

// Draw an icon centred on (x, y) at the given scale, in SVG user units.
function wxGlyph(key, x, y, scale, colour, title, opacity) {
  const s = (scale / 16).toFixed(4);
  return `<g class="wx-ico" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s}) translate(-8 -8)"
    fill="none" stroke="${colour}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
    ${opacity == null ? "" : `opacity="${opacity.toFixed(2)}"`}>
    ${title ? `<title>${title}</title>` : ""}${WX[key]}</g>`;
}

const WX_TTL = 30 * 60 * 1000;         // refetch a city at most twice an hour
const wxData = new Map();              // cityId -> {at, rows:[[epochMs, code, temp]]}
const wxPending = new Set();

function wxRead(city) {
  if (wxData.has(city.id)) return wxData.get(city.id);
  try {
    const raw = localStorage.getItem("worldclock.wx." + city.id);
    if (raw) {
      const v = JSON.parse(raw);
      wxData.set(city.id, v);
      return v;
    }
  } catch {}
  return null;
}

function wxEnsure(city, onLoad) {
  if (state.weather === "off") return wxRead(city);
  const have = wxRead(city);
  if (have && Date.now() - have.at < WX_TTL) return have;
  if (wxPending.has(city.id)) return have;
  wxPending.add(city.id);

  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat +
    "&longitude=" + city.lon + "&hourly=weather_code,temperature_2m" +
    "&forecast_days=3&timeformat=unixtime&timezone=UTC";
  fetch(url)
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(j => {
      const t = j.hourly.time, c = j.hourly.weather_code, temp = j.hourly.temperature_2m;
      const rows = t.map((sec, i) => [sec * 1000, c[i], temp[i]]);
      const v = { at: Date.now(), rows };
      wxData.set(city.id, v);
      try { localStorage.setItem("worldclock.wx." + city.id, JSON.stringify(v)); } catch {}
      onLoad();
    })
    .catch(() => { /* offline or blocked: the dome simply shows no icons */ })
    .finally(() => wxPending.delete(city.id));
  return have;
}

/* =======================================================================
   Clock face (SVG)
   ======================================================================= */
const CX = 100, CY = 100;
const pol = (r, deg) => [CX + r * Math.sin(deg * RAD), CY - r * Math.cos(deg * RAD)];

/* -----------------------------------------------------------------------
   The sky dome above each dial. The horizontal axis is not clock time — it
   is progress across the sky, so the left edge is always the rising horizon
   and the right edge the setting one however long the day happens to be.
   Nothing here can be misread as a clock angle.

   The dome is a whole circle seen edge on. The arc above the horizon is the
   visible sky and the trough below it the hidden one, and a body that sets at
   the right-hand end carries on leftwards through the trough to rise again at
   the left. Sun and moon are both on it at all times, so one is always in the
   trough: they circle, rather than each running left to right in turn.
   ----------------------------------------------------------------------- */
const SKY = {
  h: 100,       // viewBox height; the extra room is for the forecast icons
  y: 62,        // the horizon
  x0: 18, x1: 182,
  rise: 42,     // how high a body climbs above the horizon at its transit
  dip: 15       // how far it dips below at its anti-transit
};
const skyX = t => 100 - 82 * Math.cos(Math.PI * t);
const skyY = (t, up) => SKY.y + (up ? -SKY.rise : SKY.dip) * Math.sin(Math.PI * t);
// Below the horizon the direction of travel reverses, which is what closes the
// circle: rise at the left, set at the right, back to the left underneath.
const spanX = (t, up) => skyX(up ? t : 1 - t);

/* Where on the dome a body sits, from its declination and hour angle.
   |H| < W is above the horizon, on the arc; the rest is the trough. W, the
   semi-diurnal arc, is the same half-day-length term the sunrise equation
   uses, so the arc's ends agree with the printed sunrise and sunset. */
function domeSpot(latDeg, dec, H, h0) {
  const lat = latDeg * RAD;
  const cosW = (Math.sin(h0) - Math.sin(lat) * Math.sin(dec)) /
               (Math.cos(lat) * Math.cos(dec));
  const Hn = ((H + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  // Circumpolar: nothing rises or sets, so run the whole day across one half.
  if (cosW <= -1) return { t: 0.5 + Hn / (2 * Math.PI), up: true };
  if (cosW >= 1) return { t: 0.5 - Hn / (2 * Math.PI), up: false };
  const W = Math.acos(cosW);
  if (Math.abs(Hn) <= W) return { t: 0.5 + Hn / (2 * W), up: true };
  const h = Hn > 0 ? Hn : Hn + 2 * Math.PI;          // W .. 2π-W, set to rise
  return { t: (h - W) / (2 * Math.PI - 2 * W), up: false };
}
// Standard altitudes for "risen": the sun's apparent disc, the moon's centre
// allowing for parallax and refraction.
const SUN_H0 = -0.833 * RAD, MOON_H0 = 0.125 * RAD;

/* The moon, drawn as it actually looks from the city: a disc with a terminator
   swept across it. The outer arc is the lit limb and the inner elliptical one
   the terminator, whose half-width is |1-2f| of the radius, so f = 0 collapses
   it onto the limb (nothing), f = 0.5 flattens it to a straight edge (half) and
   f = 1 pushes it out to the far limb (full). South of the equator the whole
   thing is seen upside down, so the lit side swaps. */
const MOON_R = 5.4;
function moonPath(f, litRight) {
  const rx = (MOON_R * Math.abs(1 - 2 * f)).toFixed(2);
  const bulge = f < 0.5 ? 0 : 1;               // which way the terminator curves
  const outer = litRight ? 1 : 0;
  const term = litRight ? bulge : 1 - bulge;
  return `M 0 ${-MOON_R} A ${MOON_R} ${MOON_R} 0 0 ${outer} 0 ${MOON_R} ` +
         `A ${rx} ${MOON_R} 0 0 ${term} 0 ${-MOON_R} Z`;
}

// Both bodies, drawn around (0,0) and moved into place with a translate. The
// moon goes first so that at new moon it passes behind the sun, not over it.
function skyBodies() {
  let rays = "";
  for (let i = 0; i < 8; i++) {
    const a = i * 45;
    const s = Math.sin(a * RAD), c = Math.cos(a * RAD);
    rays += `<line x1="${(s * 5).toFixed(2)}" y1="${(-c * 5).toFixed(2)}"
      x2="${(s * 6.9).toFixed(2)}" y2="${(-c * 6.9).toFixed(2)}"
      stroke="var(--sun)" stroke-width="1.15" stroke-linecap="round"/>`;
  }
  return `
  <g class="sky-moon" transform="translate(${SKY.x0} ${SKY.y})">
    <title></title>
    <circle r="7.4" fill="var(--moon)" opacity=".13"/>
    <!-- The whole disc, faintly: at new moon there is nothing else to see, and
         the dark limb is the rest of the time the only clue to how full it is. -->
    <circle r="${MOON_R}" fill="none" stroke="var(--moon)" stroke-width=".6" opacity=".45"/>
    <path class="moon-lit" d="${moonPath(0.5, true)}" fill="var(--moon)"/>
  </g>
  <g class="sky-sun" transform="translate(${SKY.x0} ${SKY.y})">
    <circle r="8.4" fill="var(--sun)" opacity=".17"/>
    ${rays}
    <circle r="3.4" fill="var(--sun)"/>
  </g>`;
}

function domeSVG() {
  const { y, x0, x1, rise, dip } = SKY;
  const day = `M ${x0} ${y} A 82 ${rise} 0 0 1 ${x1} ${y}`;
  const night = `M ${x0} ${y} A 82 ${dip} 0 0 0 ${x1} ${y}`;
  return `
  <path class="dome-fill" d="${day} Z" fill="var(--sun)" opacity=".08"/>
  <path class="dome-day" d="${day}" fill="none" stroke="var(--sun)" stroke-width="1.5" opacity=".55"/>
  <path class="dome-night" d="${night}" fill="none" stroke="currentColor" stroke-width="1"
    stroke-dasharray="2 3" opacity=".22"/>
  <line x1="6" y1="${y}" x2="194" y2="${y}" stroke="currentColor" stroke-width="1" opacity=".28"/>
  <line x1="${x0}" y1="${y - 4}" x2="${x0}" y2="${y + 4}" stroke="currentColor" stroke-width="1" opacity=".4"/>
  <line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="currentColor" stroke-width="1" opacity=".4"/>
  <g class="wx"></g>
  ${skyBodies()}`;
}

const DIAL = 92;      // dial disc radius
const WXRING = 105;   // where a single forecast ring sits, outside the dial

/* The viewBox has to open up to make room for whatever rings are drawn, and
   stays centred on the dial so a drag can find the centre from the element box
   alone. The pixel width grows with it, so the dial itself renders at roughly
   the same size whichever rings are on; width:100% still caps it to the card. */
const TEMP_RING = 121, ICON_RING_BOTH = 101;

function clockBox() {
  if (compact()) return { box: "-4 -4 208 208", px: 132 };   // no rings out here
  // Room for the ring plus whatever sits on it. Temperature labels are wide:
  // a four-character reading like -10° needs about 13 units either side of its
  // centre, and at the three and nine o'clock positions that overhangs the box
  // and gets clipped.
  const half = state.weather !== "dial" ? 104
    : state.ring === "both" ? TEMP_RING + 14
    : state.ring === "temps" ? WXRING + 14
    : 113;
  const span = half * 2;
  return { box: `${100 - half} ${100 - half} ${span} ${span}`,
           px: Math.round(span * (218 / 226)) };
}

function faceSVG() {
  let ticks = "";
  for (let i = 0; i < 60; i++) {
    const hour = i % 5 === 0;
    const a = i * 6;
    const [x1, y1] = pol(hour ? 76 : 80.5, a);
    const [x2, y2] = pol(85, a);
    ticks += `<line class="${hour ? "tick-hour" : "tick-min"}"
      x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"
      stroke="var(--dial-fg)" stroke-width="${hour ? 2.6 : 1}" opacity="${hour ? .92 : .3}" stroke-linecap="butt"/>`;
  }
  let nums = "";
  for (const [n, a] of [[12, 0], [3, 90], [6, 180], [9, 270]]) {
    const [x, y] = pol(63, a);
    nums += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central"
      font-size="12" font-weight="500" fill="var(--dial-fg)" opacity=".8">${n}</text>`;
  }
  return `
  <circle cx="${CX}" cy="${CY}" r="${DIAL}" fill="var(--dial)" stroke="var(--dial-edge)" stroke-width="1"/>
  <g class="wxring"></g>
  <g>${ticks}${nums}</g>
  <!-- Where a click would land: a ghost of the hour hand, under the real hands
       so the two never muddle, and a tag with the time it would set, over them
       so it stays readable. Both hidden until the pointer is on the dial. -->
  <g class="ghost-hand" style="display:none" pointer-events="none" transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 3.1}" y="${CY - 52}" width="6.2" height="54" rx="1.4"
      fill="var(--accent)" opacity=".6"/>
  </g>
  <g class="hand-hour"  transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 3.1}" y="${CY - 52}" width="6.2" height="60" rx="1.4" fill="var(--dial-fg)"/>
  </g>
  <g class="hand-min" transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 2.2}" y="${CY - 74}" width="4.4" height="84" rx="1.1" fill="var(--dial-fg)"/>
  </g>
  <g class="hand-sec" transform="rotate(0 ${CX} ${CY})">
    <rect x="${CX - 0.75}" y="${CY - 78}" width="1.5" height="96" rx="0.75" fill="var(--accent)"/>
    <circle cx="${CX}" cy="${CY}" r="3.6" fill="var(--accent)"/>
  </g>
  <circle cx="${CX}" cy="${CY}" r="1.5" fill="var(--dial)"/>
  <!-- The centre is the way back to now, so it rings while time is paused. -->
  <circle class="hub-ring" cx="${CX}" cy="${CY}" r="17" fill="none" stroke="var(--accent)"
    stroke-width="2" opacity="0" pointer-events="none"/>
  <g class="ghost-tag" style="display:none" pointer-events="none">
    <rect class="ghost-bg" x="${CX - 20}" y="${CY + 22}" width="40" height="18" rx="9"
      fill="var(--accent)"/>
    <text class="ghost-txt" x="${CX}" y="${CY + 31.4}" text-anchor="middle"
      dominant-baseline="central" font-size="11.5" font-weight="600" fill="#14140f"></text>
  </g>`;
}

/* =======================================================================
   Cards
   ======================================================================= */
const grid = document.getElementById("grid");
let cards = [];
let dragFrom = null;

// Which slot the dragged card would land in: the near half of a card means
// before it, the far half means after it.
const insertIndex = (el, i, clientX) => {
  const r = el.getBoundingClientRect();
  return i + (clientX > r.left + r.width / 2 ? 1 : 0);
};
const clearDropMarks = () => {
  for (const c of cards) c.el.classList.remove("drop-before", "drop-after");
};
function endDrag() {
  clearDropMarks();
  for (const c of cards) c.el.classList.remove("dragging");
  dragFrom = null;
}

function buildCards() {
  stopEdit();          // the card holding the editor is about to be replaced
  document.documentElement.dataset.density = compact() ? "compact" : "full";
  grid.textContent = "";
  cards = state.ids.map((id, i) => {
    const city = BY_ID.get(id) || BY_ID.get(DEFAULTS[0]);
    const el = document.createElement("article");
    el.className = "card day";
    el.innerHTML = `
      <button class="card__remove" title="Remove" aria-label="Remove ${city.name}">&times;</button>
      <button class="card__name" title="Change city">
        <b>${city.name}</b><span class="meta"></span>
      </button>
      <svg class="clock" viewBox="${clockBox().box}" style="max-width:${clockBox().px}px"
        role="img" aria-label="Analog clock for ${city.name}">${faceSVG()}</svg>
      <div class="digital">
        <time title="Click to convert a time across every city"></time>
        <input class="tedit" type="text" inputmode="text" autocomplete="off"
          spellcheck="false" draggable="false" hidden
          aria-label="Convert a time in ${city.name} across every city">
        <span class="rel"></span>
      </div>
      <div class="mini-wx"></div>
      <div class="skyband">
        <svg class="dome" viewBox="0 0 200 ${SKY.h}" aria-hidden="true">${domeSVG()}</svg>
        <div class="sun">
          <span class="sun-rise" title="Sunrise">${ICON_SUNRISE}<span class="rise"></span></span>
          <span class="sun-polar" hidden></span>
          <span class="wx-now"></span>
          <span class="sun-set" title="Sunset"><span class="set"></span>${ICON_SUNSET}</span>
        </div>
      </div>
      <div class="next"></div>`;
    el.querySelector(".card__name").addEventListener("click", () => openPicker(i));
    el.querySelector(".card__remove").addEventListener("click", () => removeAt(i));

    // ---- click the time to convert one across every city
    const timeEl = el.querySelector("time");
    const editEl = el.querySelector(".tedit");
    timeEl.addEventListener("click", () => startEdit(i));
    editEl.addEventListener("input", () => applyTyped(i));
    editEl.addEventListener("blur", () => { if (!scrub) stopEdit(); });
    editEl.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.stopPropagation(); goLive(); }
      else if (e.key === "Enter") { e.preventDefault(); editEl.select(); }
    });

    // ---- click an hour mark to go there, the centre to come back to now
    const clockEl = el.querySelector(".clock");
    clockEl.addEventListener("click", e => dialClick(i, clockEl, e));
    clockEl.addEventListener("pointermove", e => { scrubMove(e); dialHover(i, clockEl, e); });
    clockEl.addEventListener("pointerleave", () => dialHover(i, clockEl, null));
    // ---- and the hidden gestures: hold a modifier and drag the dial to wind
    // time. Left off the compact tiles, where the dial is too small to aim at.
    if (!compact()) {
      clockEl.addEventListener("pointerdown", e => scrubStart(i, clockEl, e));
      clockEl.addEventListener("pointerup", scrubEnd);
      clockEl.addEventListener("pointercancel", scrubEnd);
    }

    // ---- drag to reorder
    el.draggable = true;
    el.addEventListener("dragstart", e => {
      dragFrom = i;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", city.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", endDrag);
    el.addEventListener("dragover", e => {
      if (dragFrom === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const at = insertIndex(el, i, e.clientX);
      clearDropMarks();
      // No caret where the drop would put the card back where it started.
      if (at !== dragFrom && at !== dragFrom + 1) {
        el.classList.add(at > i ? "drop-after" : "drop-before");
      }
    });
    el.addEventListener("dragleave", () => {
      el.classList.remove("drop-before", "drop-after");
    });
    el.addEventListener("drop", e => {
      e.preventDefault();
      clearDropMarks();
      if (dragFrom === null) return;
      moveCard(dragFrom, insertIndex(el, i, e.clientX));
    });
    grid.appendChild(el);
    return {
      city, el,
      meta: el.querySelector(".meta"),
      time: el.querySelector("time"),
      tedit: el.querySelector(".tedit"),
      rel: el.querySelector(".rel"),
      rise: el.querySelector(".rise"),
      set: el.querySelector(".set"),
      sunRise: el.querySelector(".sun-rise"),
      sunSet: el.querySelector(".sun-set"),
      sunPolar: el.querySelector(".sun-polar"),
      hourHand: el.querySelector(".hand-hour"),
      minHand: el.querySelector(".hand-min"),
      secHand: el.querySelector(".hand-sec"),
      domeDay: el.querySelector(".dome-day"),
      domeNight: el.querySelector(".dome-night"),
      domeFill: el.querySelector(".dome-fill"),
      wx: el.querySelector(".wx"),
      wxNow: el.querySelector(".wx-now"),
      sunG: el.querySelector(".sky-sun"),
      moonG: el.querySelector(".sky-moon"),
      moonLit: el.querySelector(".moon-lit"),
      moonTitle: el.querySelector(".sky-moon title"),
      ghostHand: el.querySelector(".ghost-hand"),
      ghostTag: el.querySelector(".ghost-tag"),
      ghostBg: el.querySelector(".ghost-bg"),
      ghostTxt: el.querySelector(".ghost-txt"),
      hubRing: el.querySelector(".hub-ring"),
      next: el.querySelector(".next"),
      wxRing: el.querySelector(".wxring"),
      miniWx: el.querySelector(".mini-wx")
    };
  });

  const add = document.createElement("button");
  add.className = "add";
  add.draggable = false;
  add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add city`;
  add.addEventListener("click", () => openPicker(-1));
  grid.appendChild(add);
}

/* -----------------------------------------------------------------------
   Configuration — the only numbers you need to touch to reshape the day.
   ----------------------------------------------------------------------- */
const CONFIG = {
  morning:   8 * 60,   // 08:00 — start of the working day
  evening:  18 * 60,   // 18:00 — end of the working day
  nightFrom: 20 * 60,  // 20:00 — the shading goes fully dark   ("hours" mode)
  nightTo:    6 * 60,  // 06:00 — and fully light again
  fade:          45,   // minutes either side of those, spent fading
  dayAbove:       2,   // sun this high  = full daylight        ("solar" mode)
  nightBelow:    -6    // sun this low   = full dark (civil twilight)
};
const isNight = m => m >= CONFIG.nightFrom || m < CONFIG.nightTo;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = t => t * t * (3 - 2 * t);
// Signed shortest distance in minutes between two points on a 24-hour circle.
const cyc = d => { const x = ((d % 1440) + 1440) % 1440; return x > 720 ? x - 1440 : x; };

// 0 = full daylight, 1 = full dark. Two ways of deciding, both continuous.
function darkness(city, sun, p, nowMs) {
  if (state.solar) {
    const alt = altitudeAt(city.lat, sun, nowMs);
    return smooth(clamp01((CONFIG.dayAbove - alt) /
                          (CONFIG.dayAbove - CONFIG.nightBelow)));
  }
  const m = p.minutes;
  const edge = Math.min(Math.abs(cyc(m - CONFIG.nightFrom)),
                        Math.abs(cyc(m - CONFIG.nightTo)));
  const half = smooth(clamp01(edge / CONFIG.fade)) / 2;
  return isNight(m) ? 0.5 + half : 0.5 - half;
}

/* Two things can carry nightfall, and the choice is a mode.

   Card (the default): the card is the sky and it darkens, running white ->
   sunset -> dusk blue -> near black, while the dial stays a pale disc on it.
   The dial then reads as the moon, and the thing that changes is the thing that
   actually changes outdoors.

   Dial: the older behaviour. Only the watch face fades and the card keeps the
   page theme, which is the safer arrangement on a wall of cards.

   Either way the fading surface's own text does NOT interpolate with it: at the
   midpoint it would land on the same grey as its background and vanish, which
   is the exact problem the fade was meant to avoid. It steps at the halfway
   point instead, and both halves stay legible: on the crossover colour, black
   is about 4.6:1 and white about 4.5:1. */
const DIAL_STOPS = [[255, 255, 255], [138, 133, 120], [16, 16, 16]];
const CARD_STOPS = [[255, 255, 255], [216, 166, 140], [54, 52, 92], [16, 16, 22]];

function rampColour(stops, k) {
  const span = 1 / (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(k / span));
  const t = (k - i * span) / span;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},` +
         `${Math.round(a[1] + (b[1] - a[1]) * t)},` +
         `${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}

// The four card variables, plus the sun and moon inks, so that a daylight card
// on a dark page still gets daylight colours on its dome.
const CARD_INK = {
  day:   { fg: "#131311", muted: "rgba(19,19,17,.6)", edge: "rgba(0,0,0,.11)",
           sun: "#e5a52c", moon: "#8f8f86" },
  night: { fg: "#f2f2ef", muted: "rgba(242,242,239,.58)", edge: "rgba(255,255,255,.16)",
           sun: "#e8ae3d", moon: "#e2e2d8" }
};
const CARD_VARS = ["--face", "--fg", "--muted", "--edge", "--sun", "--moon"];

function applyPalette(el, k) {
  // In card shading the dial holds still at its daylight end: it is the moon.
  const dialK = state.shade === "card" ? 0 : k;
  el.style.setProperty("--dial", rampColour(DIAL_STOPS, dialK));
  el.style.setProperty("--dial-fg", dialK < 0.5 ? "#131311" : "#f2f2ef");
  if (state.shade !== "card") {
    for (const v of CARD_VARS) el.style.removeProperty(v);
    el.style.removeProperty("--dial-edge");
    return;
  }
  const ink = k < 0.5 ? CARD_INK.day : CARD_INK.night;
  el.style.setProperty("--face", rampColour(CARD_STOPS, k));
  el.style.setProperty("--fg", ink.fg);
  el.style.setProperty("--muted", ink.muted);
  el.style.setProperty("--edge", ink.edge);
  el.style.setProperty("--sun", ink.sun);
  el.style.setProperty("--moon", ink.moon);
  // The dial keeps its own rim: --edge has gone dark with the card.
  el.style.setProperty("--dial-edge", "rgba(0,0,0,.12)");
}

const viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const wrapDay = v => ((v % 1440) + 1440) % 1440;
let toolsRev = 0;   // bumped when 12/24h changes, to force a text refresh

function update() {
  stepSpin();
  // While a time is being converted the whole board runs off that instant
  // instead of the clock, which is what stops the hands.
  const nowMs = state.frozen != null ? state.frozen : Date.now();
  const now = new Date(nowMs);
  // Seconds come straight off the epoch rather than the formatted parts, so the
  // sweep is perfectly continuous and identical on every card. Every IANA zone
  // is a whole number of minutes from UTC, so seconds-of-minute are universal.
  const secs = (nowMs % 60000) / 1000;
  const spun = spinning();
  const viewerDay = Date.UTC(viewer.y, viewer.mo - 1, viewer.d);
  // Both bodies' positions in the sky depend only on the instant, so they are
  // worked out once here; each card then only needs its own hour angle.
  const days = daysSince2000(nowMs);
  const sEq = sunEq(days), mEq = moonEq(days);

  for (const c of cards) {
    const p = partsFor(c.city.tz, now);

    // ---- hands: all three drift continuously; the second hand floats, never ticks.
    // Mid-spin it is parked: at these rates it would whip round several times a
    // second, which reads as a jitter rather than as motion.
    c.secHand.setAttribute("transform", `rotate(${spun ? 0 : secs * 6} ${CX} ${CY})`);
    c.minHand.setAttribute("transform", `rotate(${(p.mi + secs / 60) * 6} ${CX} ${CY})`);
    c.hourHand.setAttribute("transform", `rotate(${((p.h % 12) + p.mi / 60 + secs / 3600) * 30} ${CX} ${CY})`);

    // Text and the dome only change once a second — no need to touch the DOM
    // for them 60 times a second. This also establishes the span the body is
    // crossing, so it has to run before the body is placed. While spinning,
    // drop to once a minute: at four hours a second the seconds are a blur
    // nobody can read, and repainting them all is pure cost.
    const rev = (spinning() ? Math.floor(nowMs / 60000) * 60
                            : p.h * 3600 + p.mi * 60 + p.s) + toolsRev * 1e7;
    if (c._rev !== rev) {
      c._rev = rev;
      paintSlow(c, p, nowMs, viewerDay);
    }

    // ---- sun and moon both creep round the dome in real time, each on its own
    // orbit, so one of the two is always under the horizon.
    const lst = siderealTime(days, c.city.lon);
    placeBody(c.sunG, domeSpot(c.city.lat, sEq.dec, lst - sEq.ra, SUN_H0));
    placeBody(c.moonG, domeSpot(c.city.lat, mEq.dec, lst - mEq.ra, MOON_H0));
  }

  // ---- page skin: on auto, it follows night where the viewer is
  // This used to be a majority vote of the cards on screen, which drifted with
  // no visible cause: adding a city or one card crossing dusk could flip the
  // whole page. Tying it to the viewer's own evening makes it predictable, and
  // it stops depending on which cities happen to be on the board.
  // Deliberately the real local time, not the paused one: the page is the shell
  // around the board, and having it strobe light and dark while time is being
  // wound through evenings is worse than having it sit still.
  const here = state.frozen == null ? viewer : partsFor(viewerTz, new Date());
  const dark = state.theme === "dark" ||
    (state.theme === "auto" && isNight(here.minutes));
  document.documentElement.classList.toggle("dark", dark);

  paintTitle();

  requestAnimationFrame(update);
}

// A body below the horizon is out of sight rather than gone, so it goes quiet
// instead of disappearing: the pair still reads as one circling movement.
function placeBody(g, spot) {
  g.setAttribute("transform",
    `translate(${spanX(spot.t, spot.up).toFixed(2)} ${skyY(spot.t, spot.up).toFixed(2)})`);
  const op = spot.up ? "" : ".38";
  if (g._op !== op) { g._op = op; g.style.opacity = op; }
}

/* The tab title carries the first few clocks, so a pinned tab or a hover over
   the taskbar reads as a status line. Always the real time, never a paused or
   wound one: as a readout it should not lie about what time it is. The app name
   stays on the end so a bookmark is still recognisable. */
let titleMinute = -1;
function paintTitle() {
  const real = Date.now();
  const minute = Math.floor(real / 60000);
  if (minute === titleMinute || spinning()) return;
  titleMinute = minute;
  const at = new Date(real);
  const shown = cards.slice(0, 3).map(c => {
    const p = partsFor(c.city.tz, at);
    const t = clockText(p.h, p.mi, state.hour12);
    return t.t + (t.suffix ? t.suffix : "") + " " + c.city.name;
  });
  const more = cards.length - shown.length;
  document.title = (shown.length ? shown.join(" · ") + (more > 0 ? ` +${more}` : "") + " — " : "")
    + "Timezones";
}

function paintSlow(c, p, nowMs, viewerDay) {
  // ---- the sky dome: which span are we in, and where inside it?
  const sun = sunFor(c.city, p);
  let sunUp, from = null, to = null;
  if (sun.polar) {
    // Nothing rises or sets, so run the body across the dome once per day.
    sunUp = sun.polar === "day";
    from = p.midnightUTC;
    to = p.midnightUTC + 86400000;
    c.sunRise.hidden = c.sunSet.hidden = true;
    c.sunPolar.hidden = false;
    c.sunPolar.textContent = sunUp ? "midnight sun" : "polar night";
  } else {
    sunUp = nowMs >= sun.sunrise && nowMs < sun.sunset;
    if (sunUp) {
      from = sun.sunrise; to = sun.sunset;
    } else if (nowMs < sun.sunrise) {
      // Small hours: the span runs from yesterday's sunset to this sunrise.
      const prev = sunForOffset(c.city, p, -1);
      from = prev.sunset != null ? prev.sunset : sun.sunrise - 43200000;
      to = sun.sunrise;
    } else {
      const next = sunForOffset(c.city, p, 1);
      from = sun.sunset;
      to = next.sunrise != null ? next.sunrise : sun.sunset + 43200000;
    }
    c.rise.textContent = stamp(wrapDay((sun.sunrise - p.midnightUTC) / 60000), state.hour12);
    c.set.textContent = stamp(wrapDay((sun.sunset - p.midnightUTC) / 60000), state.hour12);
    c.sunRise.hidden = c.sunSet.hidden = false;
    c.sunPolar.hidden = true;
  }
  c._spanFrom = from; c._spanTo = to; c._sunUp = sunUp;

  // ---- the moon's phase, as it is seen from this city
  const ph = moonPhase(nowMs);
  // Lit on the right while waxing, and the other way round south of the
  // equator, where the whole disc is seen upside down.
  const litRight = ph.waxing !== (c.city.lat < 0);
  const phKey = Math.round(ph.fraction * 100) + (litRight ? "r" : "l");
  if (c._phKey !== phKey) {
    c._phKey = phKey;
    c.moonLit.setAttribute("d", moonPath(ph.fraction, litRight));
    c.moonTitle.textContent = phaseName(ph) + ", " + Math.round(ph.fraction * 100) + "% lit";
  }

  // Light the half of the dome we are actually in; the other half stays a
  // faint track. The warm sky fill would read as a brown mass at night.
  c.domeDay.style.opacity = sunUp ? ".55" : ".18";
  c.domeNight.style.opacity = sunUp ? ".12" : ".4";
  c.domeFill.style.opacity = sunUp ? ".085" : "0";

  // ---- day / night skin, faded rather than flipped
  const k = darkness(c.city, sun, p, nowMs);
  c._isNight = k > 0.5;
  if (c._k === undefined || Math.abs(c._k - k) > 0.002) {
    c._k = k;
    applyPalette(c.el, k);
  }
  c.el.classList.toggle("day", k <= 0.5);
  c.el.classList.toggle("night", k > 0.5);

  // ---- forecast icons along the dome
  paintWeather(c, nowMs, sunUp);

  // ---- digital read-out
  const t = clockText(p.h, p.mi, state.hour12);
  c.time.innerHTML = t.t + (t.suffix ? `<small>${t.suffix}</small>` : "");
  c.meta.textContent = c.city.place + " · " + offsetLabel(p.offset);

  // The city's own weekday, rather than today / tomorrow / yesterday. A day name
  // is an absolute fact and needs no reference point, which is what you want on
  // a board where cards differ in date from each other and not only from yours.
  // Compact tiles keep their rule of saying only what is surprising: the same
  // date as yours stays blank, and a different one gets the day in three letters,
  // which is what the old ±1d was trying to say.
  const cardDay = Date.UTC(p.y, p.mo - 1, p.d);
  const name = DAY_NAMES[new Date(cardDay).getUTCDay()];
  c.rel.textContent = !compact() ? name
    : cardDay === viewerDay ? "" : name.slice(0, 3);

  // ---- whichever working-day boundary comes round next, and nothing else
  const m = p.minutes;
  const { morning, evening } = CONFIG;
  const toMorning = wrapDay(morning - m), toEvening = wrapDay(evening - m);
  const morningNext = toMorning <= toEvening;
  const mins = morningNext ? toMorning : toEvening;
  // Compact has no room for words, so the sunrise/sunset icon carries the sense
  // of which end of the day is coming next.
  c.next.innerHTML = compact()
    ? (morningNext ? ICON_SUNRISE : ICON_SUNSET) + `<b>${fmtDur(mins)}</b>`
    : `<b>${fmtDur(mins)}</b> till ${morningNext ? "morning" : "evening"} ` +
      stamp(morningNext ? morning : evening, state.hour12);
}

/* -----------------------------------------------------------------------
   Forecast icons ride the dome alongside the sun, so they cover the span we
   are currently in: now until sunset by day, now until sunrise by night.
   Spaced out to at most six so they never collide on a long summer day.
   ----------------------------------------------------------------------- */
function paintWeather(c, nowMs, sunUp) {
  if (state.weather === "off") {
    if (c._wxKey !== "off") {
      c._wxKey = "off";
      c.wx.textContent = ""; c.wxRing.textContent = "";
      c.wxNow.textContent = ""; c.miniWx.textContent = "";
    }
    return;
  }
  const data = wxEnsure(c.city, () => { c._wxKey = null; });
  if (!data) return;
  // Mid-spin the hour changes several times a second; re-deriving the forecast
  // that often is wasted work and reads as flicker. scrubEnd refreshes it.
  if (spinning()) return;

  const hour = Math.floor(nowMs / 3600000);
  const key = state.weather + "|" + state.ring + "|" + state.units + "|" + hour +
              "|" + Math.round(c._spanTo / 60000) + "|" + sunUp + "|" + data.at +
              "|" + (compact() ? "c" : "f");
  if (c._wxKey === key) return;
  c._wxKey = key;

  // Current conditions go in the middle of the sunrise/sunset row either way.
  const nowRow = data.rows.find(r => r[0] > nowMs - 3600000 && r[0] <= nowMs + 1800000);
  c.wxNow.innerHTML = nowRow ? wxSpan(wxIcon(nowRow[1], sunUp), fmtTemp(nowRow[2])) : "";

  // Compact tiles carry the next three hours as a strip instead of a ring.
  if (compact()) {
    c.wx.textContent = "";
    c.wxRing.textContent = "";
    c.miniWx.innerHTML = data.rows.filter(r => r[0] > nowMs).slice(0, 3).map(([ts, code, temp]) => {
      const p2 = partsFor(c.city.tz, new Date(ts));
      const s2 = sunFor(c.city, p2);
      const up = s2.polar ? s2.polar === "day" : (ts >= s2.sunrise && ts < s2.sunset);
      const key2 = wxIcon(code, up);
      return `<svg viewBox="0 0 16 16"><title>${stamp(p2.minutes, state.hour12)} · ` +
        `${WX_TEXT[key2]}, ${fmtTemp(temp)}</title>` +
        `<g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
           stroke-linejoin="round">${WX[key2]}</g></svg>`;
    }).join("");
    return;
  }
  c.miniWx.textContent = "";

  if (state.weather === "dial") {
    c.wx.textContent = "";
    paintDialRing(c, nowMs, data);
    return;
  }
  c.wxRing.textContent = "";

  const ahead = data.rows.filter(r => r[0] > nowMs + 1800000 && r[0] <= c._spanTo);
  if (!ahead.length) { c.wx.textContent = ""; return; }

  // Space the icons by distance along the arc, not by time. skyX is a cosine,
  // so it barely moves near sunrise and sunset while the hours keep passing —
  // picking every Nth hour piles them up at the ends. Seeding from the sun's
  // own position also stops the first icon colliding with it. They follow the
  // sun's direction of travel, so by night they read right to left.
  const MIN_GAP = 15;
  const span = c._spanTo - c._spanFrom;
  let lastX = spanX(clamp01((nowMs - c._spanFrom) / span), sunUp);
  const picks = [];
  for (const [ts, code, temp] of ahead) {
    const t = clamp01((ts - c._spanFrom) / span);
    const x = spanX(t, sunUp);
    if (Math.abs(x - lastX) < MIN_GAP) continue;
    picks.push([t, x, code, temp]);
    lastX = x;
    if (picks.length === 6) break;
  }

  c.wx.innerHTML = picks.map(([t, x, code, temp]) => {
    const y = skyY(t, sunUp) + (sunUp ? -12.5 : 13.5);
    const key = wxIcon(code, sunUp);
    return wxGlyph(key, x, y, 12.5, "currentColor", `${WX_TEXT[key]}, ${Math.round(temp)}°`);
  }).join("");
  c.wx.style.opacity = ".5";
}

/* The coming hours arranged outside the dial, as icons, temperatures or both.
   The analog face already maps hours to angles, so each forecast hour lands on
   its own hour position — including in the half-hour zones, since the angle
   comes from that hour's local wall-clock time rather than from a slot index.
   Opacity falls away with distance in time, which gives the reading direction.

   Eleven hours, not twelve. The twelfth lands on exactly the same angle as the
   current hour, because twelve hours is a full turn of this dial. That closed
   the ring into a seamless circle with the faintest icon sitting under the hour
   hand next to the strongest, so there was nothing to read it from and the
   whole ring looked like it shuffled arbitrarily whenever the time changed.
   Stopping one short leaves a deliberate gap at the current hour: the gap is
   now, and the ring reads clockwise from it. */
const RING_HOURS = 11;

function paintDialRing(c, nowMs, data) {
  const rows = data.rows.filter(r => r[0] > nowMs).slice(0, RING_HOURS);
  const both = state.ring === "both";
  const iconR = both ? ICON_RING_BOTH : WXRING;
  const tempR = both ? TEMP_RING : WXRING;
  const out = [];
  rows.forEach((row, i) => {
    const [ts, code, temp] = row;
    const p2 = partsFor(c.city.tz, new Date(ts));
    const sun2 = sunFor(c.city, p2);
    const up = sun2.polar ? sun2.polar === "day" : (ts >= sun2.sunrise && ts < sun2.sunset);
    const angle = ((p2.minutes % 720) / 720) * 360;
    const key = wxIcon(code, up);
    const op = 0.8 - 0.45 * (i / Math.max(1, rows.length - 1));
    const label = `${stamp(p2.minutes, state.hour12)} · ${WX_TEXT[key]}, ${fmtTemp(temp)}`;
    if (state.ring !== "temps") {
      const [x, y] = pol(iconR, angle);
      out.push(wxGlyph(key, x, y, both ? 14 : 15, "currentColor", label, op));
    }
    if (state.ring !== "icons") {
      const [x, y] = pol(tempR, angle);
      // The title goes on a wrapper, not inside the text: as a child of <text>
      // it lands in textContent and the temperature gets read out twice.
      out.push(`<g class="wx-temp" opacity="${op.toFixed(2)}"><title>${label}</title>
        <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
          dominant-baseline="central" font-size="11.5" font-weight="500"
          fill="currentColor">${fmtTemp(temp)}</text></g>`);
    }
  });
  c.wxRing.innerHTML = out.join("");
}

function wxSpan(key, label) {
  return `<svg viewBox="0 0 16 16" aria-hidden="true">${
    `<g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
       stroke-linejoin="round">${WX[key]}</g>`}</svg><span>${label}</span>`;
}

/* =======================================================================
   Converting a time

   Click any digital read-out and the whole board pauses on that instant, so
   a time someone quotes in their own zone can be read straight off every
   other card. Because everything downstream keys off the same instant, the
   sky domes, the dial darkness and the working-hours line all describe that
   moment too, not just the digits.
   ======================================================================= */
let editing = null;      // index of the card being edited
let editAnchor = null;   // that city's local date, held still while typing
const frozenNote = document.getElementById("frozenNote");
const noteLabel = document.getElementById("noteLabel");

// "14:30", "1430", "930", "2.30", "2:30pm", "9a", "14" ...
function parseTimeInput(raw) {
  const s = raw.trim().toLowerCase().replace(/\s+/g, "");
  if (!s) return null;
  const suffix = /([ap])\.?m?\.?$/.exec(s);
  const body = (suffix ? s.slice(0, suffix.index) : s).replace(/[.h]/g, ":");
  let h, m;
  if (body.includes(":")) {
    const [a, b = "0"] = body.split(":");
    if (!/^\d{1,2}$/.test(a) || !/^\d{1,2}$/.test(b)) return null;
    h = +a; m = +b;
  } else if (/^\d{1,2}$/.test(body)) { h = +body; m = 0; }
  else if (/^\d{3}$/.test(body)) { h = +body[0]; m = +body.slice(1); }
  else if (/^\d{4}$/.test(body)) { h = +body.slice(0, 2); m = +body.slice(2); }
  else return null;
  if (suffix) {
    if (h < 1 || h > 12) return null;
    h = (h % 12) + (suffix[1] === "p" ? 12 : 0);
  }
  if (h > 23 || m > 59) return null;
  return { h, m };
}

// The instant at which a given zone's wall clock reads y-mo-d h:mi. Solved by
// correction rather than by assuming an offset, since the offset in force is
// itself a function of the answer. Two passes settle it, including across a
// daylight-saving change.
function zonedTimeToEpoch(tz, y, mo, d, h, mi) {
  const target = Date.UTC(y, mo - 1, d, h, mi);
  let guess = target;
  for (let i = 0; i < 2; i++) {
    const p = partsFor(tz, new Date(guess));
    guess += target - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  }
  return guess;
}

// The click preview goes stale too: which time a mark stands for depends on
// where the board is now, so it has to be re-derived after any jump.
const repaintAll = () => { for (const c of cards) { c._rev = null; c._ghostKey = null; } };

// The board is paused whenever state.frozen is set, whichever way it got there:
// typing a time, or dragging a dial. Both entry points share this so a gesture
// that starts while the other is active does not drop the pause on the floor.
function freezeAt(ms) {
  state.frozen = ms;
  document.documentElement.classList.add("frozen");
  frozenNote.hidden = false;
  setNote();
  repaintAll();
}

// Truncate to the minute so the second hand parks exactly at twelve.
const currentMinute = () => Math.floor(Date.now() / 60000) * 60000;

function closeEditor(keepFrozen) {
  if (editing !== null) {
    const c = cards[editing];
    if (c) {
      c.tedit.hidden = true;
      c.time.hidden = false;
      c.el.classList.remove("editing");
    }
    editing = null;
    editAnchor = null;
    for (const k of cards) k.el.draggable = true;
  }
  if (!keepFrozen) goLive();
}

function goLive() {
  closeEditor(true);
  scrub = null;
  state.frozen = null;
  document.documentElement.classList.remove("frozen");
  frozenNote.hidden = true;
  for (const k of cards) { k.el.draggable = true; setGhost(k, ""); }
  repaintAll();
}
const stopEdit = () => closeEditor(false);

function startEdit(i) {
  if (editing === i) return;
  closeEditor(true);
  const c = cards[i];
  editing = i;
  const base = state.frozen != null ? state.frozen : currentMinute();
  const p = partsFor(c.city.tz, new Date(base));
  editAnchor = { y: p.y, mo: p.mo, d: p.d };
  freezeAt(zonedTimeToEpoch(c.city.tz, p.y, p.mo, p.d, p.h, p.mi));
  c.time.hidden = true;
  c.tedit.hidden = false;
  c.tedit.classList.remove("bad");
  c.tedit.value = stamp(p.h * 60 + p.mi, state.hour12);
  c.tedit.focus();
  c.tedit.select();
  c.el.classList.add("editing");
  // A draggable card swallows text selection inside its own input.
  for (const k of cards) k.el.draggable = false;
}

function applyTyped(i) {
  const c = cards[i];
  const t = parseTimeInput(c.tedit.value);
  c.tedit.classList.toggle("bad", !t);
  if (!t) return;                     // keep the last good instant while typing
  freezeAt(zonedTimeToEpoch(c.city.tz, editAnchor.y, editAnchor.mo, editAnchor.d, t.h, t.m));
}

/* -----------------------------------------------------------------------
   Clicking a dial

   The dial is already a map of the day, so it is also the control: click the
   mark you want and the hour hand goes there, click the centre and the board
   comes back to now. Nothing to hold down, nothing to discover, and it works
   the same with a mouse or a thumb.

   Snapped to the half hour. The hour marks are the obvious targets and each
   sits dead centre of its own segment, while the midpoints between them cover
   the :30 that most meetings actually start on.

   A 12-hour dial names two times, and the nearer one is the one meant: clicking
   the mark behind the hour hand steps back an hour rather than forward eleven,
   and no click ever moves the board more than six hours.
   ----------------------------------------------------------------------- */
const HUB_R = 24;             // the centre target, in dial units
const DIAL_HIT = DIAL + 6;    // out to the rim; the forecast ring is a read-out
let woundAt = 0;              // when a winding gesture last finished

// Where the pointer is on the dial, in dial units from the centre. Every
// viewBox is centred on the dial, so the element's own centre is the pivot.
function dialPoint(el, e) {
  const r = el.getBoundingClientRect();
  const k = el.viewBox.baseVal.width / r.width;
  const ux = (e.clientX - (r.left + r.width / 2)) * k;
  const uy = (e.clientY - (r.top + r.height / 2)) * k;
  return { r: Math.hypot(ux, uy), deg: (Math.atan2(ux, -uy) / RAD + 360) % 360 };
}

function dialTarget(city, deg) {
  const base = state.frozen != null ? state.frozen : currentMinute();
  const p = partsFor(city.tz, new Date(base));
  const m = p.h * 60 + p.mi;
  const half = (Math.round(deg / 15) % 24) * 30;
  const a = cyc(half - m), b = cyc(half + 720 - m);
  const total = m + (Math.abs(a) <= Math.abs(b) ? a : b);
  return { p, mins: wrapDay(total), dayShift: Math.floor(total / 1440) };
}

function dialClick(i, el, e) {
  // A modifier press is one of the winding gestures, which end their own way.
  if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
  // A drag that ended here also produces a click. Let the wind stand rather
  // than jumping somewhere else, including when the modifier was let go first.
  if (Date.now() - woundAt < 400) return;
  const c = cards[i];
  const pt = dialPoint(el, e);
  setGhost(c, "");
  if (pt.r <= HUB_R) { goLive(); return; }
  if (pt.r > DIAL_HIT) return;
  closeEditor(true);                       // keep any typed instant as the base
  const { p, mins, dayShift } = dialTarget(c.city, pt.deg);
  freezeAt(zonedTimeToEpoch(c.city.tz, p.y, p.mo, p.d + dayShift,
    Math.floor(mins / 60), mins % 60));
  for (const k of cards) k._wxKey = null;
}

/* The preview: a ghost of the hour hand where it would land, and a tag with the
   time that means, so aiming is never a guess. Mouse only, since there is no
   hovering on a touch screen and a tap acts immediately anyway. */
function setGhost(c, key, deg, mins) {
  if (c._ghostKey === key) return;
  c._ghostKey = key;
  c.hubRing.style.opacity = key === "hub" ? ".9" : "0";
  if (key === "hub" || !key) {
    c.ghostHand.style.display = "none";
    c.ghostTag.style.display = "none";
    return;
  }
  c.ghostHand.setAttribute("transform", `rotate(${deg} ${CX} ${CY})`);
  c.ghostHand.style.display = "";
  const txt = stamp(mins, state.hour12);
  c.ghostTxt.textContent = txt;
  const w = Math.max(34, txt.length * 6.9 + 12);
  c.ghostBg.setAttribute("width", w.toFixed(1));
  c.ghostBg.setAttribute("x", (CX - w / 2).toFixed(1));
  c.ghostTag.style.display = "";
}

function dialHover(i, el, e) {
  const c = cards[i];
  if (!c) return;
  if (!e || scrub || e.pointerType !== "mouse" || e.shiftKey || e.altKey) {
    setGhost(c, ""); return;
  }
  const pt = dialPoint(el, e);
  // The centre only does something while the board is paused, so that is the
  // only time it offers anything.
  if (pt.r <= HUB_R) { setGhost(c, state.frozen != null ? "hub" : ""); return; }
  if (pt.r > DIAL_HIT) { setGhost(c, ""); return; }
  const deg = (Math.round(pt.deg / 15) % 24) * 15;
  const key = "d" + deg + (state.hour12 ? "h" : "");
  if (c._ghostKey === key) return;
  setGhost(c, key, deg, dialTarget(c.city, deg).mins);
}

/* -----------------------------------------------------------------------
   Winding a dial: the hidden gestures

   Both are behind a modifier, because a plain press on a dial now means jump.

   Spin (hold Shift) is a sprung joystick. Pull left or right of where you
   pressed and time runs that way, faster the further you pull, until you let
   go. Pulling is cheap, so covering half a day costs one gesture rather than
   the dozen turns winding needed.

   Wind (hold Alt) is the literal one: six degrees is one minute, so the minute
   hand tracks the pointer and a full turn is an hour. Precise, but tedious over
   any distance.

   Either way, releasing leaves the board paused, and a modified press with no
   drag returns to now, same as clicking the centre.
   ----------------------------------------------------------------------- */
let scrub = null;
const spinning = () => !!(scrub && scrub.armed && scrub.mode === "spin" && scrub.rate);

// Minutes of clock time per real second, from how far the pointer has been
// pulled. Squared so the near end stays controllable while the far end still
// covers a day in a couple of seconds: about 0.8 min/s just outside the dead
// zone, up to 2 h/s at full stretch.
const SPIN = { dead: 6, gain: 0.8, max: 120, arm: 4 };
function spinRate(dx) {
  const pull = Math.abs(dx) - SPIN.dead;
  if (pull <= 0) return 0;
  return Math.sign(dx) * Math.min(SPIN.max, SPIN.gain * (pull / 10) ** 2);
}

const dialAngle = (el, x, y) => {
  const r = el.getBoundingClientRect();
  // Every viewBox is centred on the dial, so the element's centre is the pivot.
  return Math.atan2(x - (r.left + r.width / 2),
                    (r.top + r.height / 2) - y) * 180 / Math.PI;
};

function scrubStart(i, el, e) {
  if (e.button !== undefined && e.button !== 0) return;
  const mode = e.shiftKey ? "spin" : e.altKey ? "wind" : null;
  if (!mode) return;                  // a plain press belongs to click-to-jump
  e.preventDefault();
  closeEditor(true);                  // keep any typed instant as the base
  scrub = {
    el, mode,
    armed: false, rate: 0, tick: Date.now(),
    ox: e.clientX, base: state.frozen != null ? state.frozen : currentMinute(),
    last: dialAngle(el, e.clientX, e.clientY), turned: 0
  };
  // Neither gesture may also start an HTML5 card drag.
  for (const k of cards) k.el.draggable = false;
  try { el.setPointerCapture(e.pointerId); } catch {}
}

function scrubMove(e) {
  if (!scrub) return;
  // Nothing happens until the pointer actually moves, so that a plain tap can
  // still mean "back to now" without the board flickering into a pause first.
  if (!scrub.armed) {
    if (Math.abs(e.clientX - scrub.ox) < SPIN.arm &&
        Math.abs(dialAngle(scrub.el, e.clientX, e.clientY) - scrub.last) < 2) return;
    scrub.armed = true;
    scrub.tick = Date.now();
    freezeAt(scrub.base);
  }
  if (scrub.mode === "wind") {
    const a = dialAngle(scrub.el, e.clientX, e.clientY);
    let d = a - scrub.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    scrub.turned += d;
    scrub.last = a;
    freezeAt(scrub.base + Math.round(scrub.turned / 6) * 60000);
  } else {
    scrub.rate = spinRate(e.clientX - scrub.ox);   // update() does the moving
  }
}

function scrubEnd() {
  if (!scrub) return;
  const wasArmed = scrub.armed;
  scrub = null;
  for (const k of cards) k.el.draggable = true;
  if (!wasArmed) { goLive(); return; }             // a tap means back to now
  woundAt = Date.now();
  // Land on a whole minute so the second hand parks at twelve, and let the
  // forecast catch up with wherever we ended.
  state.frozen = Math.round(state.frozen / 60000) * 60000;
  for (const c of cards) c._wxKey = null;
  setNote();
  repaintAll();
}

// Advance a running spin. Called once per frame from update().
function stepSpin() {
  if (!scrub || !scrub.armed || scrub.mode !== "spin") return;
  const now = Date.now();
  const dt = Math.min(0.1, (now - scrub.tick) / 1000);   // ignore long stalls
  scrub.tick = now;
  if (scrub.rate) state.frozen += scrub.rate * dt * 60000;
  setNote();
}

let noteText = "";
function setNote() {
  const rate = scrub && scrub.armed && scrub.mode === "spin" ? scrub.rate : 0;
  const t = !rate ? "Clocks paused"
    : (rate > 0 ? "Forward " : "Back ") +
      (Math.abs(rate) < 60 ? Math.round(Math.abs(rate)) + " min/s"
                           : (Math.abs(rate) / 60).toFixed(1) + " h/s");
  if (t !== noteText) { noteText = t; noteLabel.textContent = t; }
}

/* =======================================================================
   Mutations
   ======================================================================= */
function removeAt(i) {
  if (state.ids.length <= 1) { toast("Keep at least one clock"); return; }
  state.ids.splice(i, 1);
  persist(); buildCards();
}
function setAt(i, id) {
  if (i < 0) state.ids.push(id); else state.ids[i] = id;
  persist(); buildCards();
}
// insertAt is a slot in the list as it stands now, so pulling the card out
// first shifts every later slot down by one.
function moveCard(from, insertAt) {
  const [id] = state.ids.splice(from, 1);
  state.ids.splice(insertAt > from ? insertAt - 1 : insertAt, 0, id);
  persist(); buildCards();
}

/* =======================================================================
   City picker
   ======================================================================= */
const sheet = document.getElementById("sheet");
const search = document.getElementById("search");
const list = document.getElementById("list");
const removeBtn = document.getElementById("removeBtn");
let target = -1, matches = [], cursor = 0;

function openPicker(i) {
  target = i;
  document.getElementById("sheetTitle").textContent =
    i < 0 ? "Add a city" : "Replace " + (BY_ID.get(state.ids[i]) || {}).name;
  removeBtn.hidden = i < 0 || state.ids.length <= 1;
  search.value = "";
  sheet.classList.add("open");
  renderList("");
  search.focus();
}
function closePicker() { sheet.classList.remove("open"); target = -1; }

function renderList(q) {
  const query = q.trim().toLowerCase();
  const terms = query.split(/\s+/).filter(Boolean);
  const rank = c => {
    const n = c.name.toLowerCase(), t = terms[0];
    if (n.startsWith(t)) return 0;
    if (n.includes(t)) return 1;
    if (c.country.toLowerCase().startsWith(t)) return 2;
    return 3;
  };
  matches = (terms.length
    ? CITIES.filter(c => terms.every(t => c.hay.includes(t)))
        .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name))
    : CITIES.slice()
  ).slice(0, 120);
  cursor = 0;
  list.textContent = "";
  if (!matches.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No city matches “" + q.trim() + "”.";
    list.appendChild(p);
    return;
  }
  const now = new Date();
  matches.forEach((c, i) => {
    const p = partsFor(c.tz, now);
    const t = clockText(p.h, p.mi, state.hour12);
    const row = document.createElement("button");
    row.className = "row";
    row.type = "button";
    row.setAttribute("role", "option");
    row.setAttribute("aria-selected", i === 0 ? "true" : "false");
    row.innerHTML = `<b></b><span></span><time></time>`;
    row.querySelector("b").textContent = c.name;
    row.querySelector("span").textContent = c.region ? c.region + ", " + c.country : c.country;
    row.querySelector("time").textContent = t.t + (t.suffix ? " " + t.suffix : "");
    row.addEventListener("click", () => { setAt(target, c.id); closePicker(); });
    row.addEventListener("mousemove", () => moveCursor(i, false));
    list.appendChild(row);
  });
}

function moveCursor(i, scroll = true) {
  const rows = list.querySelectorAll(".row");
  if (!rows.length) return;
  cursor = (i + rows.length) % rows.length;
  rows.forEach((r, k) => r.setAttribute("aria-selected", k === cursor ? "true" : "false"));
  if (scroll) rows[cursor].scrollIntoView({ block: "nearest" });
}

search.addEventListener("input", () => renderList(search.value));
search.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(cursor + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(cursor - 1); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (matches[cursor]) { setAt(target, matches[cursor].id); closePicker(); }
  }
});
sheet.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });
sheet.addEventListener("mousedown", e => { if (e.target === sheet) closePicker(); });
document.getElementById("cancelBtn").addEventListener("click", closePicker);
removeBtn.addEventListener("click", () => { const i = target; closePicker(); removeAt(i); });

/* =======================================================================
   Settings menu

   Each setting is a segmented control showing every option at once. The
   previous single cycling button gave no clue what it would switch to, and
   two of these are modes rather than on/off toggles, so the selected option
   also gets a line explaining what it does.
   ======================================================================= */
const dock = document.getElementById("dock");
const menuBtn = document.getElementById("menu");
const settings = document.getElementById("settings");

const HINTS = {
  shade: {
    card: "The card is the sky and darkens with the city, leaving the dial as a pale moon on it.",
    dial: "Only the watch face darkens. The cards keep the page theme, which is steadier on a big board."
  },
  solar: {
    "0": "Every city darkens between 20:00 and 06:00. Identical everywhere, so cards are easy to compare.",
    "1": "Each city darkens at its own dusk, following the real sun. Correct at high latitudes."
  },
  weather: {
    dial: "The coming hours, one per hour, around the outside of the dial.",
    dome: "The hours left in the current day or night, along the sky dome.",
    off: "No forecast, and no requests to the weather service."
  },
  ring: {
    icons: "Conditions only. The gap in the ring is the current hour; it reads clockwise from there.",
    temps: "Temperatures only, at each hour position.",
    both: "Temperatures on an outer ring, conditions on an inner one."
  },
  density: {
    auto: `Compact below ${COMPACT_BELOW}px wide, full above it.`,
    full: "Every card carries its dial, sky dome and forecast ring.",
    compact: "Four tiles across: dial, time, and the next three hours. No dome, no dial dragging."
  }
};

const settingValue = group =>
  group === "hour12" ? (state.hour12 ? "1" : "0") :
  group === "solar" ? (state.solar ? "1" : "0") :
  group === "shade" ? state.shade :
  group === "weather" ? state.weather :
  group === "ring" ? state.ring :
  group === "units" ? state.units :
  group === "density" ? state.density : state.theme;

function syncTools() {
  for (const seg of settings.querySelectorAll(".seg")) {
    const current = settingValue(seg.dataset.group);
    for (const b of seg.querySelectorAll("button")) {
      const on = b.dataset.val === current;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    }
  }
  document.getElementById("hint-shade").textContent = HINTS.shade[state.shade];
  document.getElementById("hint-solar").textContent = HINTS.solar[settingValue("solar")];
  document.getElementById("hint-weather").textContent = HINTS.weather[state.weather];
  document.getElementById("hint-ring").textContent = HINTS.ring[state.ring];
  document.getElementById("hint-density").textContent = HINTS.density[state.density];
  document.getElementById("hint-theme").textContent = state.theme === "auto"
    ? `Dark between ${stamp(CONFIG.nightFrom, state.hour12)} and ` +
      `${stamp(CONFIG.nightTo, state.hour12)} where you are.`
    : "";
  // The ring only exists in dial mode; dim rather than hide, so it stays findable.
  document.getElementById("sec-ring").classList.toggle("muted", state.weather !== "dial");
}

function applySetting(group, val) {
  if (group === "hour12") {
    state.hour12 = val === "1";
    store.set(LS.hour12, val);
    toolsRev++;                                 // forces the text to repaint
    for (const c of cards) c._wxKey = null;     // and the forecast tooltips
  } else if (group === "solar" || group === "shade") {
    if (group === "solar") state.solar = val === "1"; else state.shade = val;
    store.set(LS[group], val);
    // Both change what the ramp paints, so every card has to be re-inked now
    // rather than at the next perceptible change in darkness.
    for (const c of cards) c._k = undefined;
    repaintAll();
  } else if (group === "weather" || group === "ring" || group === "density") {
    state[group] = val;
    store.set(LS[group], val);
    syncTools();
    buildCards();          // viewBox, layout and which handlers apply all change
    return;
  } else if (group === "units") {
    state.units = val;
    store.set(LS.units, val);
    for (const c of cards) c._wxKey = null;
    repaintAll();
  } else {
    state.theme = val;
    store.set(LS.theme, val);
  }
  syncTools();
}

settings.addEventListener("click", e => {
  const b = e.target.closest("button[role=radio]");
  if (b) applySetting(b.parentElement.dataset.group, b.dataset.val);
});

// Arrow keys move through a group, as a radiogroup is expected to.
settings.addEventListener("keydown", e => {
  const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
    : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
  if (!step) return;
  const b = e.target.closest("button[role=radio]");
  if (!b) return;
  e.preventDefault();
  const seg = b.parentElement;
  const all = [...seg.querySelectorAll("button")];
  const next = all[(all.indexOf(b) + step + all.length) % all.length];
  applySetting(seg.dataset.group, next.dataset.val);
  next.focus();
});

function setMenu(open) {
  settings.hidden = !open;
  dock.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
menuBtn.addEventListener("click", () => setMenu(settings.hidden));
document.addEventListener("pointerdown", e => {
  if (settings.hidden || settings.contains(e.target) || dock.contains(e.target)) return;
  setMenu(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!settings.hidden) { setMenu(false); menuBtn.focus(); }
    else if (state.frozen != null) goLive();
    return;
  }
  // Arrows step the board an hour at a time, which is the quickest way to line
  // up a meeting. Left alone where they already mean something: inside the
  // time field they move the caret, inside the menu they change the setting.
  const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (!step || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input, #settings")) return;
  e.preventDefault();
  freezeAt((state.frozen != null ? state.frozen : currentMinute()) + step * 3600000);
  for (const c of cards) c._wxKey = null;
});

// Clicking away from a dial or a time field returns to now. The dock and the
// menu are exempt, so units and rings can be changed while the board is paused.
document.addEventListener("pointerdown", e => {
  if (state.frozen == null || scrub) return;
  if (e.target.closest(".clock, .digital, .dock, #settings")) return;
  goLive();
});

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
document.getElementById("share").addEventListener("click", async () => {
  persist();
  try {
    await navigator.clipboard.writeText(location.href);
    toast("Link copied");
  } catch {
    toast(location.href);
  }
});

/* =======================================================================
   Go
   ======================================================================= */
syncTools();
persist();
buildCards();
update();

// On auto, crossing the breakpoint changes the layout, the viewBox and which
// handlers are attached, so the cards have to be rebuilt — but only when the
// answer actually flips, not on every resize event.
let wasCompact = compact();
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (compact() !== wasCompact) { wasCompact = compact(); buildCards(); }
  }, 150);
});

// Offline support, only when actually served: registering a worker from a file://
// URL throws, and opening index.html straight from disk is a supported way to
// use this.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// The first update() has now settled every card into its day/night skin, so
// re-enable the cross-fades for everything that happens from here on.
requestAnimationFrame(() => requestAnimationFrame(
  () => document.documentElement.classList.remove("booting")));
</script>
</body>
</html>
